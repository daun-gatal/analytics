kind: ConfigMap
apiVersion: v1
metadata:
  name: metabase-register-config
  namespace: analytics
data:
  #
  # register-duckdb.py runs in Job/metabase-register on every metabase
  # apply, signed in as the Metabase admin from Secret/metabase-admin
  # (generated once by CI — no API key needed):
  #
  #   fresh Metabase  -> completes the setup wizard via /api/setup with
  #                      that admin, then adds each METABASE_DATABASES entry
  #   already set up  -> signs in as that admin; adds each database only
  #                      when none with that name exists (skip)
  #   set up by hand  -> sign-in fails -> warning, skip. To adopt such an
  #   with another       instance, put its admin email/password into
  #   admin              Secret/metabase-admin and re-apply.
  #
  METABASE_URL: http://metabase.analytics.svc.cluster.local
  METABASE_SITE_NAME: Analytics
  # Metabase database name = DuckFlight dbname, comma-separated. DuckFlight
  # uses dbname as the default catalog: it decides which DuckDB catalog's
  # tables a Metabase database lists and resolves schema.table against.
  #   Lake      -> datalake   RustFS built-in catalog (datalake table bucket)
  #   Lakehouse -> lakehouse  Lakekeeper catalog (lakehouse bucket; attached
  #                           by duckdb when the warehouse is reachable)
  METABASE_DATABASES: Lake=datalake,Lakehouse=lakehouse
  DUCKFLIGHT_HOST: duckdb.analytics.svc.cluster.local
  DUCKFLIGHT_PORT: '5433'

  register-duckdb.py: |
    """Set up Metabase (when fresh) and add DuckDB/DuckFlight, if missing.

    Exit 0 on: database exists (skip), admin can't sign in to an instance
    someone else set up (skip), Metabase not healthy in 10 min (warning).
    Exit 1 on any other refusal (setup rejected, failed connection test).
    """
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.request

    env = os.environ.get
    base = env("METABASE_URL", "").rstrip("/")
    databases = [tuple(p.strip() for p in item.split("=", 1))
                 for item in env("METABASE_DATABASES", "Lake=datalake").split(",") if "=" in item]
    email = (env("METABASE_ADMIN_EMAIL") or "").strip()
    password = env("METABASE_ADMIN_PASSWORD") or ""

    if not email or not password:
        print("⏭  Metabase: no admin credentials (Secret metabase-admin) — skipping registration")
        sys.exit(0)


    class Refused(Exception):
        def __init__(self, code, msg):
            super().__init__(msg)
            self.code = code


    session = None


    def call(method, path, body=None, timeout=60):
        headers = {"Content-Type": "application/json", "Accept": "application/json"}
        if session:
            headers["X-Metabase-Session"] = session
        req = urllib.request.Request(
            base + path, method=method, headers=headers,
            data=json.dumps(body).encode() if body is not None else None)
        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                raw = resp.read()
                return json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            detail = e.read()[:600].decode("utf-8", "replace")
            raise Refused(e.code, f"{method} {path} -> HTTP {e.code}: {detail}") from None


    def create_database(name, dbname):
        """POST /api/database; Metabase tests the DuckFlight connection first.
        Right after a fresh RustFS table bucket, DuckDB's catalog calls can
        fail for minutes (RustFS nodes answer 400 'not table-enabled' until
        they catch up), and DuckDB itself may still be starting: retry for
        up to 8 min. Credential errors fail at once."""
        body = {
            "engine": "postgres",
            "name": name,
            "details": {
                "host": env("DUCKFLIGHT_HOST"),
                "port": int(env("DUCKFLIGHT_PORT", "5433")),
                "dbname": dbname,
                "user": env("DUCKFLIGHT_USER"),
                "password": env("DUCKFLIGHT_PASSWORD"),
                # self-signed cert, regenerated per duckdb pod: encrypt,
                # don't verify
                "ssl": True,
                "ssl-mode": "require",
                "tunnel-enabled": False,
                "let-user-control-scheduling": True,
            },
            # every scan is a full read of the Iceberg tables: schema
            # sync only — no field-value scans, no auto-rerun
            "is_full_sync": False,
            "is_on_demand": False,
            "refingerprint": False,
            "auto_run_queries": False,
        }
        until = time.time() + 480
        attempt = 0
        while True:
            attempt += 1
            try:
                return call("POST", "/api/database", body, timeout=180)
            except Refused as e:
                msg = str(e).lower()
                permanent = e.code != 400 or "authentication" in msg or "password" in msg
                if permanent or time.time() > until:
                    raise
                print(f"   ↻ attempt {attempt}: {str(e)[:220]} — retrying in 15s")
                time.sleep(15)


    # Metabase restarts alongside this Job on an apply: wait up to 10 min
    deadline = time.time() + 600
    while True:
        try:
            if (call("GET", "/api/health", timeout=10) or {}).get("status") == "ok":
                break
        except Exception:
            pass
        if time.time() > deadline:
            print(f"⚠️  Metabase not healthy at {base} after 10 min — skipping registration")
            sys.exit(0)
        time.sleep(5)

    try:
        props = call("GET", "/api/session/properties") or {}
        if not props.get("has-user-setup"):
            site = env("METABASE_SITE_NAME", "Analytics")
            session = call("POST", "/api/setup", {
                "token": props.get("setup-token"),
                "user": {"email": email, "password": password,
                         "first_name": "Admin", "last_name": "Analytics",
                         "site_name": site},
                "prefs": {"site_name": site, "site_locale": "en",
                          "allow_tracking": False},
            })["id"]
            print(f"✅ Metabase: completed first-time setup — admin {email}")
        else:
            try:
                session = call("POST", "/api/session",
                               {"username": email, "password": password})["id"]
            except Refused as e:
                if e.code in (400, 401):
                    print(f"⚠️  Metabase was set up with another admin: {email} can't sign in — "
                          "skipping. Put that admin's login into Secret/metabase-admin to adopt it.")
                    sys.exit(0)
                raise

        dbs = call("GET", "/api/database")
        if isinstance(dbs, dict):
            dbs = dbs.get("data", [])
        existing = {d.get("name") for d in dbs}
        for name, dbname in databases:
            if name in existing:
                print(f"⏭  Metabase: database '{name}' already exists — skipping")
                continue
            created = create_database(name, dbname)
            print(f"✅ Metabase: added database '{name}' (id {created.get('id')}) → "
                  f"{env('DUCKFLIGHT_HOST')}:{env('DUCKFLIGHT_PORT')}/{dbname}")
    except Refused as e:
        print(f"❌ Metabase: {e}")
        sys.exit(1)
    except (urllib.error.URLError, OSError) as e:
        print(f"❌ Metabase: request failed ({e})")
        sys.exit(1)
    finally:
        if session:
            try:
                call("DELETE", "/api/session", timeout=10)
            except Exception:
                pass

