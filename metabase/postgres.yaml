# Metabase application database — dashboards, questions, users, and the
# (encrypted) DuckFlight connection. This is the ONLY stateful piece of the
# analytics namespace: the lake itself lives in RustFS.
#
# Postgres 18 images keep data under /var/lib/postgresql/18/docker, so the
# volume mounts at /var/lib/postgresql (the 18+ layout), not .../data.
kind: Service
apiVersion: v1
metadata:
  name: metabase-db
  namespace: analytics
  labels:
    app.kubernetes.io/name: metabase-db
    app.kubernetes.io/component: metabase
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: metabase-db
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: metabase-db
  namespace: analytics
  labels:
    app.kubernetes.io/name: metabase-db
    app.kubernetes.io/component: metabase
spec:
  serviceName: metabase-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metabase-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metabase-db
        app.kubernetes.io/component: metabase
    spec:
      # Run as the image's postgres user (uid/gid 70 in -alpine): no root,
      # and docker-entrypoint.sh skips its gosu privilege drop. fsGroup
      # makes the Longhorn volume writable for gid 70.
      #
      # AppArmor Unconfined: on this node (Ubuntu 26.04, AppArmor 5.0.2,
      # since 2026-11-07) container processes carry the STACKED label
      # `cri-containerd.apparmor.d//&unconfined`, which containerd's default
      # profile doesn't list as a signal peer — so every signal between
      # processes in the container is denied (kernel log:
      # apparmor="DENIED" operation="signal" … peer="…//&unconfined").
      # Postgres needs signals between its own processes (latches,
      # postmaster<->backends): logins hang in "authentication" and
      # pg_isready never answers. Drop this once the node profile is fixed.
      securityContext:
        appArmorProfile:
          type: Unconfined
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: metabase
            - name: POSTGRES_DB
              value: metabase
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metabase-secrets
                  key: db-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "metabase", "-d", "metabase"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "metabase", "-d", "metabase"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
