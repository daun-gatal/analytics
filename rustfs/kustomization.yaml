apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - bootstrap-config.yaml
  - bootstrap-job.yaml

helmCharts:
  - name: rustfs
    repo: https://charts.rustfs.com/
    # GA chart. 1.0.4 renders identically to 1.0.0 with helm.yaml (only
    # the image tag changes) and was validated locally on 2026-11-09:
    # bootstrap.sh table bucket + pyiceberg create/append/scan + DuckDB
    # 2.0.0 ATTACH/read. Stay on GA tags: upstream pruned the
    # 1.0.1-preview charts AND their images from public registries, so
    # a preview pin broke CI ("chart 1.0.1-preview.11 not found").
    version: 1.0.4
    releaseName: rustfs
    namespace: rustfs
    valuesFile: helm.yaml
    skipTests: true
