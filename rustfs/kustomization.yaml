apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - bootstrap-config.yaml
  - bootstrap-job.yaml

helmCharts:
  - name: rustfs
    repo: https://charts.rustfs.com/
    # Back on the GA chart: 1.0.0's table catalog is validated against
    # pyiceberg/Spark commits (2026-09-26). Upstream pruned the
    # 1.0.1-preview charts AND their images from public registries, so
    # the preview pin broke CI ("chart 1.0.1-preview.11 not found").
    version: 1.0.0
    releaseName: rustfs
    namespace: rustfs
    valuesFile: helm.yaml
    skipTests: true
