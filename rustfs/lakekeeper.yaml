# Lakekeeper — Iceberg REST catalog for the `lakehouse` bucket.
#
# RustFS stays plain object storage for this warehouse; Lakekeeper owns the
# catalog (namespaces, tables, commits) in its own Postgres. The older
# `datalake` table bucket keeps RustFS's built-in catalog, untouched.
#
#   catalog URI   http://lakekeeper.rustfs.svc.cluster.local:8181/catalog
#   warehouse     lakehouse  (s3://lakehouse, created by Job/rustfs-bootstrap)
#
# Auth: none (authz allow-all) — any pod in the cluster can use the catalog.
# Data files still need RustFS keys: Lakekeeper vends no credentials (STS
# and remote signing are off), every client brings its own scoped user.
#
# Secret/lakekeeper-secrets (db-password, encryption-key) is generated once
# by CI and never rotated: encryption-key protects the warehouse storage
# credential Lakekeeper keeps in its database.
kind: Service
apiVersion: v1
metadata:
  name: lakekeeper-db
  namespace: rustfs
  labels:
    app.kubernetes.io/name: lakekeeper-db
    app.kubernetes.io/component: lakekeeper
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: lakekeeper-db
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: lakekeeper-db
  namespace: rustfs
  labels:
    app.kubernetes.io/name: lakekeeper-db
    app.kubernetes.io/component: lakekeeper
spec:
  serviceName: lakekeeper-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lakekeeper-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakekeeper-db
        app.kubernetes.io/component: lakekeeper
    spec:
      # Same as metabase/postgres.yaml: run as the image's postgres user
      # (70:70) and AppArmor-unconfined — this node's containerd profile
      # denies signals between processes in a container, which Postgres
      # needs. Drop appArmorProfile once the node profile is fixed.
      securityContext:
        appArmorProfile:
          type: Unconfined
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: lakekeeper
            - name: POSTGRES_DB
              value: lakekeeper
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lakekeeper-secrets
                  key: db-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lakekeeper", "-d", "lakekeeper"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lakekeeper", "-d", "lakekeeper"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: lakekeeper
  namespace: rustfs
  labels:
    app.kubernetes.io/name: lakekeeper
    app.kubernetes.io/component: lakekeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lakekeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakekeeper
        app.kubernetes.io/component: lakekeeper
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532    # distroless nonroot
        runAsGroup: 65532
      initContainers:
        # schema migrations; idempotent, runs on every pod start
        - name: migrate
          image: quay.io/lakekeeper/catalog:v0.15.0
          args: ["migrate"]
          env: &lakekeeper-env
            - name: LK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lakekeeper-secrets
                  key: db-password
            - name: LAKEKEEPER__PG_DATABASE_URL_WRITE
              value: postgresql://lakekeeper:$(LK_DB_PASSWORD)@lakekeeper-db.rustfs.svc.cluster.local:5432/lakekeeper
            - name: LAKEKEEPER__PG_DATABASE_URL_READ
              value: postgresql://lakekeeper:$(LK_DB_PASSWORD)@lakekeeper-db.rustfs.svc.cluster.local:5432/lakekeeper
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lakekeeper-secrets
                  key: encryption-key
            - name: LAKEKEEPER__BASE_URI
              value: http://lakekeeper.rustfs.svc.cluster.local:8181
          securityContext: &lakekeeper-sc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: lakekeeper
          image: quay.io/lakekeeper/catalog:v0.15.0
          args: ["serve"]
          env: *lakekeeper-env
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          securityContext: *lakekeeper-sc
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
kind: Service
apiVersion: v1
metadata:
  name: lakekeeper
  namespace: rustfs
  labels:
    app.kubernetes.io/name: lakekeeper
    app.kubernetes.io/component: lakekeeper
spec:
  ports:
    - name: http
      port: 8181
      targetPort: http
  selector:
    app.kubernetes.io/name: lakekeeper
