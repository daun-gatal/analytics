kind: ConfigMap
apiVersion: v1
metadata:
  name: rustfs-bezisync-config
  namespace: rustfs
data:
  #
  # BeziSync integration, run by the rustfs-bootstrap Job after the default
  # bucket is ready (see bootstrap-job.yaml):
  #
  #   iam.sh               (init container `iam`, rustfs/rc image)
  #     ensure the least-privilege policy below + a dedicated RustFS user
  #     for BeziSync. `rc admin policy create` / `user add` upsert, so
  #     every deploy re-applies this file's policy.
  #
  #   register-bezisync.py (container `bezisync-register`)
  #     create the RustFS Iceberg destination in BeziSync — only when
  #     Secret/bezisync-api has a token (GitHub Secret BEZISYNC_API_TOKEN),
  #     and only when no connection named BEZISYNC_CONNECTION_NAME exists
  #     in the project yet. An existing one is left untouched.
  #
  # Credentials (Secrets in ns rustfs, created by CI):
  #   rustfs-credentials  root keys            (GitHub RUSTFS_* secrets)
  #   rustfs-bezisync     access-key/secret-key for the BeziSync user
  #                       (generated once in-cluster, never rotated by CI)
  #   bezisync-api        token, a BeziSync API token (bzt_…) — optional
  #
  BEZISYNC_API_URL: http://bezisync-api.bezisync.svc.cluster.local:8000
  BEZISYNC_PROJECT: playground         # project slug
  BEZISYNC_CONNECTION_NAME: rustfs-lake
  BEZISYNC_ICEBERG_NAMESPACE: cdc      # tables land in datalake.cdc.*
  # BeziSync runs in another namespace: it needs the service FQDN
  RUSTFS_CLUSTER_ENDPOINT: http://rustfs-svc.rustfs.svc.cluster.local:9000
  BEZISYNC_RUSTFS_POLICY: bezisync-iceberg

  # Least privilege for an Iceberg writer on the `datalake` table bucket:
  # catalog discovery, namespace/table create, commits, metadata + data
  # files. No drop/rename (admin:DeleteTable / SetTable / DeleteTable-
  # Namespace), no other bucket. Validated on RustFS 1.0.4 (2026-11-09):
  # pyiceberg create/append/scan/add-column pass; drop table/namespace and
  # any other bucket are denied. The discovery statement is required —
  # without it GET /iceberg/v1/config is denied.
  bezisync-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "IcebergCatalogDiscovery",
          "Effect": "Allow",
          "Action": [
            "admin:GetTableCatalog",
            "admin:GetTableBucket"
          ],
          "Resource": [
            "arn:aws:s3:::datalake",
            "arn:aws:s3:::datalake/*"
          ]
        },
        {
          "Sid": "IcebergCatalogWrite",
          "Effect": "Allow",
          "Action": [
            "admin:GetTableNamespace",
            "admin:SetTableNamespace",
            "admin:GetTable",
            "admin:CreateTable",
            "admin:CommitTable",
            "admin:GetTableMetadata",
            "admin:SetTableMetadata",
            "admin:GetTableMetadataLocation"
          ],
          "Resource": [
            "arn:aws:s3:::datalake",
            "arn:aws:s3:::datalake/*"
          ]
        },
        {
          "Sid": "LakeBucket",
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": [
            "arn:aws:s3:::datalake"
          ]
        },
        {
          "Sid": "LakeObjects",
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": [
            "arn:aws:s3:::datalake/*"
          ]
        }
      ]
    }

  iam.sh: |
    #!/bin/sh
    # Ensure the BeziSync policy + user on RustFS. Idempotent (upserts).
    set -eu
    : "${RUSTFS_ACCESS_KEY:?rustfs-credentials missing}"
    : "${RUSTFS_SECRET_KEY:?rustfs-credentials missing}"
    : "${BEZISYNC_ACCESS_KEY:?rustfs-bezisync missing access-key}"
    : "${BEZISYNC_SECRET_KEY:?rustfs-bezisync missing secret-key}"

    rc alias set lake "${RUSTFS_CLUSTER_ENDPOINT}" "${RUSTFS_ACCESS_KEY}" "${RUSTFS_SECRET_KEY}" >/dev/null
    echo "▶ Ensuring policy '${BEZISYNC_RUSTFS_POLICY}'"
    rc admin policy create lake "${BEZISYNC_RUSTFS_POLICY}" /bezisync/bezisync-policy.json
    echo "▶ Ensuring user '${BEZISYNC_ACCESS_KEY}'"
    rc admin user add lake "${BEZISYNC_ACCESS_KEY}" "${BEZISYNC_SECRET_KEY}" >/dev/null
    rc admin policy attach lake "${BEZISYNC_RUSTFS_POLICY}" --user "${BEZISYNC_ACCESS_KEY}" >/dev/null
    rc admin user info lake "${BEZISYNC_ACCESS_KEY}" | grep -E "Status|Policies"
    echo "✅ RustFS user '${BEZISYNC_ACCESS_KEY}' ready with policy '${BEZISYNC_RUSTFS_POLICY}'"

  register-bezisync.py: |
    """Create the RustFS Iceberg destination in BeziSync, if missing.

    Skips (exit 0) when no API token is configured or the connection
    already exists. Unreachable BeziSync is a warning (exit 0): the lake
    deploy must not depend on it. Any API refusal (bad token, unknown
    project, invalid config) fails the Job so the deploy shows it.
    """
    import json
    import os
    import sys
    import urllib.error
    import urllib.request

    env = os.environ.get
    token = (env("BEZISYNC_API_TOKEN") or "").strip()
    api = env("BEZISYNC_API_URL", "").rstrip("/") + "/api/v1"
    slug = env("BEZISYNC_PROJECT", "playground")
    name = env("BEZISYNC_CONNECTION_NAME", "rustfs-lake")
    endpoint = env("RUSTFS_CLUSTER_ENDPOINT", "").rstrip("/")

    if not token:
        print("⏭  BeziSync: no API token (Secret bezisync-api) — skipping registration")
        sys.exit(0)


    class Refused(Exception):
        pass


    def call(method, path, body=None):
        req = urllib.request.Request(
            api + path,
            method=method,
            data=json.dumps(body).encode() if body is not None else None,
            headers={"Authorization": f"Bearer {token}",
                     "Content-Type": "application/json",
                     "Accept": "application/json"},
        )
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                raw = resp.read()
                return json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            detail = e.read()[:600].decode("utf-8", "replace")
            raise Refused(f"{method} {path} -> HTTP {e.code}: {detail}") from None


    try:
        projects = call("GET", "/projects")
        if isinstance(projects, dict):
            projects = projects.get("items", [])
        project = next((p for p in projects if p.get("slug") == slug), None)
        if project is None:
            raise Refused(f"project '{slug}' not found (or the token can't see it)")
        pid = project["id"]

        existing = call("GET", f"/projects/{pid}/connections")
        if any(c.get("name") == name for c in existing):
            print(f"⏭  BeziSync: connection '{name}' already exists in project '{slug}' — skipping")
            sys.exit(0)

        created = call("POST", f"/projects/{pid}/connections", {
            "kind": "sink",
            "type": "iceberg",
            "provider": "rustfs",
            "name": name,
            "description": "RustFS Iceberg REST catalog (datalake table bucket). "
                           "Managed by the analytics repo rustfs deploy.",
            "managed": True,
            "config": {
                "catalog_type": "rest",
                "uri": f"{endpoint}/iceberg",
                "warehouse": env("BUCKET_NAME", "datalake"),
                "namespace": env("BEZISYNC_ICEBERG_NAMESPACE", "cdc"),
                "auth": "sigv4",
                "signing_name": "s3",
                "storage": "s3",
                "s3_endpoint": endpoint,
                "path_style": True,
                "region": env("AWS_DEFAULT_REGION", "us-east-1"),
                "access_key_id": env("BEZISYNC_ACCESS_KEY"),
            },
            "secrets": {"secret_access_key": env("BEZISYNC_SECRET_KEY")},
        })
        print(f"✅ BeziSync: created destination '{name}' ({created.get('id')}) in project '{slug}'")

        try:
            report = call("POST", f"/projects/{pid}/connections/{created['id']}/check", {})
            print(f"   check: {(report or {}).get('summary', report)}")
        except Refused as e:  # informative only: the connection exists now
            print(f"⚠️  BeziSync: readiness check could not run: {e}")
    except Refused as e:
        print(f"❌ BeziSync: {e}")
        sys.exit(1)
    except (urllib.error.URLError, OSError) as e:
        print(f"⚠️  BeziSync unreachable at {api} ({e}) — skipping registration")
        sys.exit(0)
