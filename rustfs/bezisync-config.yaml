kind: ConfigMap
apiVersion: v1
metadata:
  name: rustfs-bezisync-config
  namespace: rustfs
data:
  #
  # Catalog + BeziSync wiring, run by the rustfs-bootstrap Job after the
  # buckets are ready (see bootstrap-job.yaml):
  #
  #   iam.sh               (init container `iam`, rustfs/rc image)
  #     upsert the least-privilege policies below and the RustFS users for
  #     BeziSync and Lakekeeper. `rc admin policy create` / `user add` are
  #     upserts, so every deploy re-applies these policies.
  #
  #   setup-lakekeeper.py  (init container `lakekeeper-setup`)
  #     bootstrap Lakekeeper once and create warehouse LAKEKEEPER_WAREHOUSE
  #     on s3://LAKEHOUSE_BUCKET, when missing.
  #
  #   register-bezisync.py (container `bezisync-register`)
  #     sign in as BeziSync's bootstrap admin and create each destination
  #     below that doesn't exist yet in the project (existing ones are left
  #     untouched):
  #       BEZISYNC_CONNECTION_NAME           RustFS built-in catalog, `datalake`
  #                                          table bucket (preview: append-only)
  #       BEZISYNC_LAKEHOUSE_CONNECTION_NAME Lakekeeper REST catalog,
  #                                          `lakehouse` bucket (upserts)
  #
  # Credentials (Secrets in ns rustfs, created by CI):
  #   rustfs-credentials  root keys            (GitHub RUSTFS_* secrets)
  #   rustfs-bezisync     access-key/secret-key for the BeziSync user
  #   rustfs-lakekeeper   access-key/secret-key for the Lakekeeper user
  #                       (both generated once in-cluster, never rotated by CI)
  #   bezisync-login      email/password of BeziSync's bootstrap admin, copied
  #                       by CI from bezisync/bezisync-secrets on every apply
  #                       (absent when BeziSync isn't installed -> skip)
  #
  BEZISYNC_API_URL: http://bezisync-api.bezisync.svc.cluster.local:8000
  BEZISYNC_PROJECT: playground         # project slug
  BEZISYNC_CONNECTION_NAME: rustfs-lake
  BEZISYNC_LAKEHOUSE_CONNECTION_NAME: lakehouse
  BEZISYNC_ICEBERG_NAMESPACE: cdc      # tables land in <warehouse>.cdc.*
  # BeziSync runs in another namespace: it needs the service FQDNs
  RUSTFS_CLUSTER_ENDPOINT: http://rustfs-svc.rustfs.svc.cluster.local:9000
  LAKEKEEPER_URL: http://lakekeeper.rustfs.svc.cluster.local:8181
  LAKEKEEPER_WAREHOUSE: lakehouse
  BEZISYNC_RUSTFS_POLICY: bezisync-iceberg
  LAKEKEEPER_RUSTFS_POLICY: lakekeeper-warehouse

  # BeziSync's RustFS user. Least privilege for an Iceberg writer:
  #  - `datalake` table bucket (RustFS built-in catalog): catalog discovery,
  #    namespace/table create, commits, metadata + data files. No
  #    drop/rename, no other bucket. Validated on RustFS 1.0.4 (2026-11-09):
  #    pyiceberg create/append/scan/add-column pass; drop table/namespace and
  #    other buckets are denied. The discovery statement is required —
  #    without it GET /iceberg/v1/config is denied.
  #  - `lakehouse` bucket (Lakekeeper catalog): plain object access only —
  #    the catalog itself is Lakekeeper, which vends no credentials.
  bezisync-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "IcebergCatalogDiscovery",
          "Effect": "Allow",
          "Action": [
            "admin:GetTableCatalog",
            "admin:GetTableBucket"
          ],
          "Resource": [
            "arn:aws:s3:::datalake",
            "arn:aws:s3:::datalake/*"
          ]
        },
        {
          "Sid": "IcebergCatalogWrite",
          "Effect": "Allow",
          "Action": [
            "admin:GetTableNamespace",
            "admin:SetTableNamespace",
            "admin:GetTable",
            "admin:CreateTable",
            "admin:CommitTable",
            "admin:GetTableMetadata",
            "admin:SetTableMetadata",
            "admin:GetTableMetadataLocation"
          ],
          "Resource": [
            "arn:aws:s3:::datalake",
            "arn:aws:s3:::datalake/*"
          ]
        },
        {
          "Sid": "LakeBucket",
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": [
            "arn:aws:s3:::datalake",
            "arn:aws:s3:::lakehouse"
          ]
        },
        {
          "Sid": "LakeObjects",
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": [
            "arn:aws:s3:::datalake/*",
            "arn:aws:s3:::lakehouse/*"
          ]
        }
      ]
    }

  # Lakekeeper's own RustFS user: the warehouse storage credential it uses
  # to write table metadata. Object access on `lakehouse` only.
  lakekeeper-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "WarehouseBucket",
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": [
            "arn:aws:s3:::lakehouse"
          ]
        },
        {
          "Sid": "WarehouseObjects",
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": [
            "arn:aws:s3:::lakehouse/*"
          ]
        }
      ]
    }

  iam.sh: |
    #!/bin/sh
    # Ensure the RustFS policies + users for BeziSync and Lakekeeper.
    # Idempotent (upserts).
    set -eu
    : "${RUSTFS_ACCESS_KEY:?rustfs-credentials missing}"
    : "${RUSTFS_SECRET_KEY:?rustfs-credentials missing}"
    : "${BEZISYNC_ACCESS_KEY:?rustfs-bezisync missing access-key}"
    : "${BEZISYNC_SECRET_KEY:?rustfs-bezisync missing secret-key}"
    : "${LAKEKEEPER_S3_ACCESS_KEY:?rustfs-lakekeeper missing access-key}"
    : "${LAKEKEEPER_S3_SECRET_KEY:?rustfs-lakekeeper missing secret-key}"

    rc alias set lake "${RUSTFS_CLUSTER_ENDPOINT}" "${RUSTFS_ACCESS_KEY}" "${RUSTFS_SECRET_KEY}" >/dev/null

    ensure_user() {   # ensure_user <policy> <policy-file> <user> <secret>
        echo "▶ Ensuring policy '$1' + user '$3'"
        rc admin policy create lake "$1" "$2" >/dev/null
        rc admin user add lake "$3" "$4" >/dev/null
        rc admin policy attach lake "$1" --user "$3" >/dev/null
        rc admin user info lake "$3" | grep -E "Status|Policies"
        echo "✅ RustFS user '$3' ready with policy '$1'"
    }
    ensure_user "${BEZISYNC_RUSTFS_POLICY}" /bezisync/bezisync-policy.json \
        "${BEZISYNC_ACCESS_KEY}" "${BEZISYNC_SECRET_KEY}"
    ensure_user "${LAKEKEEPER_RUSTFS_POLICY}" /bezisync/lakekeeper-policy.json \
        "${LAKEKEEPER_S3_ACCESS_KEY}" "${LAKEKEEPER_S3_SECRET_KEY}"

  setup-lakekeeper.py: |
    """Bootstrap Lakekeeper and create the warehouse, if missing.

    Waits for Lakekeeper (≤10 min; it starts alongside this Job). Exit 0
    when the warehouse exists or was created; exit 1 otherwise, since the
    warehouse is part of the lake this deploy promises.
    """
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.request

    env = os.environ.get
    base = env("LAKEKEEPER_URL", "").rstrip("/")
    warehouse = env("LAKEKEEPER_WAREHOUSE", "lakehouse")
    bucket = env("LAKEHOUSE_BUCKET", "lakehouse")
    project = env("LAKEKEEPER_PROJECT_ID", "00000000-0000-0000-0000-000000000000")


    class Refused(Exception):
        pass


    def call(method, path, body=None, timeout=60):
        req = urllib.request.Request(
            base + path, method=method,
            headers={"Content-Type": "application/json", "Accept": "application/json",
                     "x-project-id": project},
            data=json.dumps(body).encode() if body is not None else None)
        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                raw = resp.read()
                return json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            raise Refused(f"{method} {path} -> HTTP {e.code}: "
                          f"{e.read()[:600].decode('utf-8', 'replace')}") from None


    deadline = time.time() + 600
    while True:
        try:
            if (call("GET", "/health", timeout=10) or {}).get("health") == "ok":
                break
        except Exception:
            pass
        if time.time() > deadline:
            print(f"❌ Lakekeeper not healthy at {base} after 10 min")
            sys.exit(1)
        time.sleep(5)

    try:
        info = call("GET", "/management/v1/info")
        if not info.get("bootstrapped"):
            call("POST", "/management/v1/bootstrap",
                 {"accept-terms-of-use": True, "is-operator": True})
            print(f"✅ Lakekeeper {info.get('version')}: bootstrapped")
        else:
            print(f"⏭  Lakekeeper {info.get('version')}: already bootstrapped")

        names = [w.get("name") for w in
                 (call("GET", "/management/v1/warehouse") or {}).get("warehouses", [])]
        if warehouse in names:
            print(f"⏭  Lakekeeper: warehouse '{warehouse}' already exists — skipping")
            sys.exit(0)

        created = call("POST", "/management/v1/warehouse", {
            "warehouse-name": warehouse,
            "storage-profile": {
                "type": "s3",
                "flavor": "s3-compat",
                "bucket": bucket,
                "region": env("AWS_DEFAULT_REGION", "us-east-1"),
                "endpoint": env("RUSTFS_CLUSTER_ENDPOINT"),
                "path-style-access": True,
                # clients bring their own S3 keys: no STS vending, no remote signing
                "sts-enabled": False,
                "remote-signing-enabled": False,
            },
            "storage-credential": {
                "type": "s3",
                "credential-type": "access-key",
                "access-key-id": env("LAKEKEEPER_S3_ACCESS_KEY"),
                "secret-access-key": env("LAKEKEEPER_S3_SECRET_KEY"),
            },
        })
        print(f"✅ Lakekeeper: created warehouse '{warehouse}' "
              f"({created.get('warehouse-id')}) on s3://{bucket}")
    except Refused as e:
        print(f"❌ Lakekeeper: {e}")
        sys.exit(1)

  register-bezisync.py: |
    """Create the lake's Iceberg destinations in BeziSync, if missing.

    Signs in as BeziSync's bootstrap admin (Secret/bezisync-login, copied by
    CI from BeziSync's own bezisync-secrets) — no API token.

    Exit 0 on: no login configured (skip), connection exists (skip),
    BeziSync unreachable or the login refused (warning). Exit 1 on any other
    refusal (unknown project, rejected config) so the deploy shows it.
    REGISTER_DRY_RUN=1 runs BeziSync's draft check instead of creating.
    """
    import json
    import os
    import sys
    import urllib.error
    import urllib.request
    from http.cookies import SimpleCookie

    env = os.environ.get
    api = env("BEZISYNC_API_URL", "").rstrip("/") + "/api/v1"
    email = (env("BEZISYNC_LOGIN_EMAIL") or "").strip()
    password = env("BEZISYNC_LOGIN_PASSWORD") or ""
    slug = env("BEZISYNC_PROJECT", "playground")
    endpoint = env("RUSTFS_CLUSTER_ENDPOINT", "").rstrip("/")
    namespace = env("BEZISYNC_ICEBERG_NAMESPACE", "cdc")
    region = env("AWS_DEFAULT_REGION", "us-east-1")
    dry = env("REGISTER_DRY_RUN") == "1"

    if not email or not password:
        print("⏭  BeziSync: no login (Secret bezisync-login) — skipping registration")
        sys.exit(0)

    # Both destinations write data files with BeziSync's own RustFS user.
    storage = {
        "storage": "s3",
        "s3_endpoint": endpoint,
        "path_style": True,
        "region": region,
        "access_key_id": env("BEZISYNC_ACCESS_KEY"),
    }
    secrets = {"secret_access_key": env("BEZISYNC_SECRET_KEY")}
    destinations = [
        {   # RustFS built-in catalog on the `datalake` table bucket (preview:
            # change logs only — BeziSync's RustFS preset is append-only)
            "name": env("BEZISYNC_CONNECTION_NAME", "rustfs-lake"),
            "provider": "rustfs",
            "description": "RustFS Iceberg REST catalog (datalake table bucket). "
                           "Managed by the analytics repo rustfs deploy.",
            "config": {
                "catalog_type": "rest",
                "uri": f"{endpoint}/iceberg",
                "warehouse": env("BUCKET_NAME", "datalake"),
                "namespace": namespace,
                "auth": "sigv4",
                "signing_name": "s3",
                **storage,
            },
        },
        {   # Lakekeeper REST catalog on the plain `lakehouse` bucket (upserts)
            "name": env("BEZISYNC_LAKEHOUSE_CONNECTION_NAME", "lakehouse"),
            "provider": "rest",
            "description": "Lakekeeper Iceberg REST catalog (lakehouse bucket on RustFS). "
                           "Managed by the analytics repo rustfs deploy.",
            "config": {
                "catalog_type": "rest",
                "uri": env("LAKEKEEPER_URL", "").rstrip("/") + "/catalog",
                "warehouse": env("LAKEKEEPER_WAREHOUSE", "lakehouse"),
                "namespace": namespace,
                "auth": "none",
                **storage,
            },
        },
    ]


    class Refused(Exception):
        def __init__(self, code, msg):
            super().__init__(msg)
            self.code = code


    cookies = {}


    def call(method, path, body=None):
        headers = {"Content-Type": "application/json", "Accept": "application/json"}
        if cookies:
            # session auth: cookies + double-submit CSRF header on writes. Sent
            # by hand — BeziSync may mark them Secure, and this is in-cluster http.
            headers["Cookie"] = "; ".join(f"{k}={v}" for k, v in cookies.items())
            if "bz_csrf" in cookies:
                headers["x-csrf-token"] = cookies["bz_csrf"]
        req = urllib.request.Request(
            api + path, method=method, headers=headers,
            data=json.dumps(body).encode() if body is not None else None)
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                for raw in resp.headers.get_all("Set-Cookie") or []:
                    for k, m in SimpleCookie(raw).items():
                        cookies[k] = m.value
                data = resp.read()
                return json.loads(data) if data else None
        except urllib.error.HTTPError as e:
            detail = e.read()[:600].decode("utf-8", "replace")
            raise Refused(e.code, f"{method} {path} -> HTTP {e.code}: {detail}") from None


    def show(report, label):
        report = report or {}
        print(f"   {label}: {report.get('summary', report)}")
        for c in report.get("checks") or []:
            if c.get("status") != "pass":
                print(f"     - {c.get('status')}: {c.get('title')} — {c.get('message')}"
                      + (f" | fix: {c['fix']}" if c.get("fix") else ""))


    signed_in = False
    try:
        try:
            call("POST", "/auth/login", {"email": email, "password": password})
            signed_in = True
        except Refused as e:
            if e.code in (401, 403):
                print(f"⚠️  BeziSync: {email} can't sign in ({e}) — skipping. "
                      "Was the bootstrap admin's password changed?")
                sys.exit(0)
            raise

        projects = call("GET", "/projects")
        if isinstance(projects, dict):
            projects = projects.get("items", [])
        project = next((p for p in projects if p.get("slug") == slug), None)
        if project is None:
            raise Refused(404, f"project '{slug}' not found (or {email} can't see it)")
        pid = project["id"]

        existing = {c.get("name") for c in call("GET", f"/projects/{pid}/connections")}
        for d in destinations:
            name = d["name"]
            if name in existing:
                print(f"⏭  BeziSync: connection '{name}' already exists in project '{slug}' — skipping")
                continue
            body = {"kind": "sink", "type": "iceberg", "provider": d["provider"],
                    "config": d["config"], "secrets": secrets}
            if dry:
                report = call("POST", f"/projects/{pid}/connections:check", body)
                print(f"🧪 BeziSync dry run: '{name}' config accepted")
                show(report, "check")
                continue
            created = call("POST", f"/projects/{pid}/connections", {
                **body, "name": name, "description": d["description"], "managed": True})
            print(f"✅ BeziSync: created destination '{name}' ({created.get('id')}) in project '{slug}'")
            try:
                report = call("POST", f"/projects/{pid}/connections/{created['id']}/check", {})
                show(report, "check")
            except Refused as e:  # informative only: the connection exists now
                print(f"⚠️  BeziSync: readiness check could not run: {e}")
    except Refused as e:
        print(f"❌ BeziSync: {e}")
        sys.exit(1)
    except (urllib.error.URLError, OSError) as e:
        print(f"⚠️  BeziSync unreachable at {api} ({e}) — skipping registration")
        sys.exit(0)
    finally:
        if signed_in:
            try:
                call("POST", "/auth/logout", {})
            except Exception:
                pass
