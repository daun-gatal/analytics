kind: ConfigMap
apiVersion: v1
metadata:
  name: rustfs-bezisync-config
  namespace: rustfs
data:
  #
  # IAM + BeziSync wiring, run by the rustfs-bootstrap Job after the
  # buckets are ready (see bootstrap-job.yaml):
  #
  #   iam.sh               (init container `iam`, rustfs/rc image)
  #     upsert the least-privilege policies below and the RustFS users for
  #     BeziSync and Polaris. `rc admin policy create` / `user add` are
  #     upserts, so every deploy re-applies these policies.
  #
  #   register-bezisync.py (container `bezisync-register`)
  #     sign in as BeziSync's bootstrap admin and create destination
  #     BEZISYNC_CONNECTION_NAME (RustFS built-in catalog, `datalake` table
  #     bucket; preview: append-only) if it doesn't exist yet in the
  #     project (an existing one is left untouched). The `lakehouse`
  #     destination (Polaris) is registered by the polaris module's
  #     Job/polaris-setup.
  #
  # Credentials (Secrets in ns rustfs, created by CI):
  #   rustfs-credentials  root keys            (GitHub RUSTFS_* secrets)
  #   rustfs-bezisync     access-key/secret-key for the BeziSync user
  #   rustfs-polaris      access-key/secret-key for the Polaris user
  #                       (both generated once in-cluster, never rotated by
  #                       CI, and copied by CI to the namespaces using them)
  #   bezisync-login      email/password of BeziSync's bootstrap admin, copied
  #                       by CI from bezisync/bezisync-secrets on every apply
  #                       (absent when BeziSync isn't installed -> skip)
  #
  BEZISYNC_API_URL: http://bezisync-api.bezisync.svc.cluster.local:8000
  BEZISYNC_PROJECT: playground         # project slug
  BEZISYNC_CONNECTION_NAME: rustfs-lake
  BEZISYNC_ICEBERG_NAMESPACE: cdc      # tables land in <warehouse>.cdc.*
  # BeziSync runs in another namespace: it needs the service FQDNs
  RUSTFS_CLUSTER_ENDPOINT: http://rustfs-svc.rustfs.svc.cluster.local:9000
  BEZISYNC_RUSTFS_POLICY: bezisync-iceberg
  POLARIS_RUSTFS_POLICY: polaris-warehouse

  # BeziSync's RustFS user. Least privilege for an Iceberg writer:
  #  - `datalake` table bucket (RustFS built-in catalog): catalog discovery,
  #    namespace/table create, commits, metadata + data files. No
  #    drop/rename, no other bucket. Validated on RustFS 1.0.4 (2026-11-09):
  #    pyiceberg create/append/scan/add-column pass; drop table/namespace and
  #    other buckets are denied. The discovery statement is required —
  #    without it GET /iceberg/v1/config is denied.
  #  - `lakehouse` bucket (Polaris catalog): plain object access only —
  #    the catalog itself is Polaris, which vends no credentials.
  bezisync-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "IcebergCatalogDiscovery",
          "Effect": "Allow",
          "Action": [
            "admin:GetTableCatalog",
            "admin:GetTableBucket"
          ],
          "Resource": [
            "arn:aws:s3:::datalake",
            "arn:aws:s3:::datalake/*"
          ]
        },
        {
          "Sid": "IcebergCatalogWrite",
          "Effect": "Allow",
          "Action": [
            "admin:GetTableNamespace",
            "admin:SetTableNamespace",
            "admin:GetTable",
            "admin:CreateTable",
            "admin:CommitTable",
            "admin:GetTableMetadata",
            "admin:SetTableMetadata",
            "admin:GetTableMetadataLocation"
          ],
          "Resource": [
            "arn:aws:s3:::datalake",
            "arn:aws:s3:::datalake/*"
          ]
        },
        {
          "Sid": "LakeBucket",
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": [
            "arn:aws:s3:::datalake",
            "arn:aws:s3:::lakehouse"
          ]
        },
        {
          "Sid": "LakeObjects",
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": [
            "arn:aws:s3:::datalake/*",
            "arn:aws:s3:::lakehouse/*"
          ]
        }
      ]
    }

  # Polaris's own RustFS user: the storage credential it uses to write
  # table metadata. Object access on `lakehouse` only.
  polaris-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "WarehouseBucket",
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": [
            "arn:aws:s3:::lakehouse"
          ]
        },
        {
          "Sid": "WarehouseObjects",
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": [
            "arn:aws:s3:::lakehouse/*"
          ]
        }
      ]
    }

  iam.sh: |
    #!/bin/sh
    # Ensure the RustFS policies + users for BeziSync and Polaris.
    # Idempotent (upserts).
    set -eu
    : "${RUSTFS_ACCESS_KEY:?rustfs-credentials missing}"
    : "${RUSTFS_SECRET_KEY:?rustfs-credentials missing}"
    : "${BEZISYNC_ACCESS_KEY:?rustfs-bezisync missing access-key}"
    : "${BEZISYNC_SECRET_KEY:?rustfs-bezisync missing secret-key}"
    : "${POLARIS_S3_ACCESS_KEY:?rustfs-polaris missing access-key}"
    : "${POLARIS_S3_SECRET_KEY:?rustfs-polaris missing secret-key}"

    rc alias set lake "${RUSTFS_CLUSTER_ENDPOINT}" "${RUSTFS_ACCESS_KEY}" "${RUSTFS_SECRET_KEY}" >/dev/null

    ensure_user() {   # ensure_user <policy> <policy-file> <user> <secret>
        echo "▶ Ensuring policy '$1' + user '$3'"
        rc admin policy create lake "$1" "$2" >/dev/null
        rc admin user add lake "$3" "$4" >/dev/null
        rc admin policy attach lake "$1" --user "$3" >/dev/null
        rc admin user info lake "$3" | grep -E "Status|Policies"
        echo "✅ RustFS user '$3' ready with policy '$1'"
    }
    ensure_user "${BEZISYNC_RUSTFS_POLICY}" /bezisync/bezisync-policy.json \
        "${BEZISYNC_ACCESS_KEY}" "${BEZISYNC_SECRET_KEY}"
    ensure_user "${POLARIS_RUSTFS_POLICY}" /bezisync/polaris-policy.json \
        "${POLARIS_S3_ACCESS_KEY}" "${POLARIS_S3_SECRET_KEY}"

  register-bezisync.py: |
    """Create the `datalake` Iceberg destination in BeziSync, if missing.

    Signs in as BeziSync's bootstrap admin (Secret/bezisync-login, copied by
    CI from BeziSync's own bezisync-secrets) — no API token.

    Exit 0 on: no login configured (skip), connection exists (skip),
    BeziSync unreachable or the login refused (warning). Exit 1 on any other
    refusal (unknown project, rejected config) so the deploy shows it.
    REGISTER_DRY_RUN=1 runs BeziSync's draft check instead of creating.
    """
    import json
    import os
    import sys
    import urllib.error
    import urllib.request
    from http.cookies import SimpleCookie

    env = os.environ.get
    api = env("BEZISYNC_API_URL", "").rstrip("/") + "/api/v1"
    email = (env("BEZISYNC_LOGIN_EMAIL") or "").strip()
    password = env("BEZISYNC_LOGIN_PASSWORD") or ""
    slug = env("BEZISYNC_PROJECT", "playground")
    endpoint = env("RUSTFS_CLUSTER_ENDPOINT", "").rstrip("/")
    namespace = env("BEZISYNC_ICEBERG_NAMESPACE", "cdc")
    region = env("AWS_DEFAULT_REGION", "us-east-1")
    dry = env("REGISTER_DRY_RUN") == "1"

    if not email or not password:
        print("⏭  BeziSync: no login (Secret bezisync-login) — skipping registration")
        sys.exit(0)

    # Data files are written with BeziSync's own RustFS user.
    storage = {
        "storage": "s3",
        "s3_endpoint": endpoint,
        "path_style": True,
        "region": region,
        "access_key_id": env("BEZISYNC_ACCESS_KEY"),
    }
    secrets = {"secret_access_key": env("BEZISYNC_SECRET_KEY")}
    destinations = [
        {   # RustFS built-in catalog on the `datalake` table bucket (preview:
            # change logs only — BeziSync's RustFS preset is append-only)
            "name": env("BEZISYNC_CONNECTION_NAME", "rustfs-lake"),
            "provider": "rustfs",
            "description": "RustFS Iceberg REST catalog (datalake table bucket). "
                           "Managed by the analytics repo rustfs deploy.",
            "config": {
                "catalog_type": "rest",
                "uri": f"{endpoint}/iceberg",
                "warehouse": env("BUCKET_NAME", "datalake"),
                "namespace": namespace,
                "auth": "sigv4",
                "signing_name": "s3",
                **storage,
            },
        },
    ]


    class Refused(Exception):
        def __init__(self, code, msg):
            super().__init__(msg)
            self.code = code


    cookies = {}


    def call(method, path, body=None):
        headers = {"Content-Type": "application/json", "Accept": "application/json"}
        if cookies:
            # session auth: cookies + double-submit CSRF header on writes. Sent
            # by hand — BeziSync may mark them Secure, and this is in-cluster http.
            headers["Cookie"] = "; ".join(f"{k}={v}" for k, v in cookies.items())
            if "bz_csrf" in cookies:
                headers["x-csrf-token"] = cookies["bz_csrf"]
        req = urllib.request.Request(
            api + path, method=method, headers=headers,
            data=json.dumps(body).encode() if body is not None else None)
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                for raw in resp.headers.get_all("Set-Cookie") or []:
                    for k, m in SimpleCookie(raw).items():
                        cookies[k] = m.value
                data = resp.read()
                return json.loads(data) if data else None
        except urllib.error.HTTPError as e:
            detail = e.read()[:600].decode("utf-8", "replace")
            raise Refused(e.code, f"{method} {path} -> HTTP {e.code}: {detail}") from None


    def show(report, label):
        report = report or {}
        print(f"   {label}: {report.get('summary', report)}")
        for c in report.get("checks") or []:
            if c.get("status") != "pass":
                print(f"     - {c.get('status')}: {c.get('title')} — {c.get('message')}"
                      + (f" | fix: {c['fix']}" if c.get("fix") else ""))


    signed_in = False
    try:
        try:
            call("POST", "/auth/login", {"email": email, "password": password})
            signed_in = True
        except Refused as e:
            if e.code in (401, 403):
                print(f"⚠️  BeziSync: {email} can't sign in ({e}) — skipping. "
                      "Was the bootstrap admin's password changed?")
                sys.exit(0)
            raise

        projects = call("GET", "/projects")
        if isinstance(projects, dict):
            projects = projects.get("items", [])
        project = next((p for p in projects if p.get("slug") == slug), None)
        if project is None:
            raise Refused(404, f"project '{slug}' not found (or {email} can't see it)")
        pid = project["id"]

        existing = {c.get("name") for c in call("GET", f"/projects/{pid}/connections")}
        for d in destinations:
            name = d["name"]
            if name in existing:
                print(f"⏭  BeziSync: connection '{name}' already exists in project '{slug}' — skipping")
                continue
            body = {"kind": "sink", "type": "iceberg", "provider": d["provider"],
                    "config": d["config"], "secrets": secrets}
            if dry:
                report = call("POST", f"/projects/{pid}/connections:check", body)
                print(f"🧪 BeziSync dry run: '{name}' config accepted")
                show(report, "check")
                continue
            created = call("POST", f"/projects/{pid}/connections", {
                **body, "name": name, "description": d["description"], "managed": True})
            print(f"✅ BeziSync: created destination '{name}' ({created.get('id')}) in project '{slug}'")
            try:
                report = call("POST", f"/projects/{pid}/connections/{created['id']}/check", {})
                show(report, "check")
            except Refused as e:  # informative only: the connection exists now
                print(f"⚠️  BeziSync: readiness check could not run: {e}")
    except Refused as e:
        print(f"❌ BeziSync: {e}")
        sys.exit(1)
    except (urllib.error.URLError, OSError) as e:
        print(f"⚠️  BeziSync unreachable at {api} ({e}) — skipping registration")
        sys.exit(0)
    finally:
        if signed_in:
            try:
                call("POST", "/auth/logout", {})
            except Exception:
                pass
