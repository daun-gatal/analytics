kind: Job
apiVersion: batch/v1
metadata:
  name: rustfs-bootstrap
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs-bootstrap
    app.kubernetes.io/part-of: rustfs
spec:
  # A failed ensure should surface as a failed Job, not retry forever:
  # readiness alone can eat 5m, the three ensure phases retry 6x each.
  backoffLimit: 6
  activeDeadlineSeconds: 1200
  # Garbage-collect the completed Job after an hour — the next rustfs/all
  # apply re-creates it, so every deploy re-verifies the default bucket
  # state (and it self-heals after PVC wipes).
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-bootstrap
        app.kubernetes.io/part-of: rustfs
    spec:
      restartPolicy: OnFailure
      # Steps run in order; each must succeed before the next starts:
      #   1. bootstrap         default bucket + S3 table bucket (bootstrap.sh)
      #   2. iam               BeziSync policy + RustFS user (iam.sh)
      #   3. bezisync-register create the BeziSync destination if missing
      #                        (skips without a token / when it exists)
      initContainers:
        - name: bootstrap
          # curl >= 7.76 is required for --aws-sigv4 (pinned 8.x)
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "/config/bootstrap.sh"]
          envFrom:
            - configMapRef:
                name: rustfs-bootstrap-config
            - secretRef:
                name: rustfs-credentials   # created by CI in ns rustfs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # curlimages/curl declares USER "curl_user" (non-numeric), which
            # the kubelet cannot verify as non-root — pin the numeric UID/GID.
            runAsUser: 100    # curl_user
            runAsGroup: 101   # curl_users
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
        - name: iam
          image: rustfs/rc:v0.1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "/bezisync/iam.sh"]
          envFrom:
            - configMapRef:
                name: rustfs-bezisync-config
            - secretRef:
                name: rustfs-credentials   # root keys, created by CI
          env:
            - name: HOME             # rc keeps its alias config here
              value: /home/rc
            - name: BEZISYNC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-bezisync
                  key: access-key
            - name: BEZISYNC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-bezisync
                  key: secret-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100    # rc
            runAsGroup: 101   # rc
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: bezisync
              mountPath: /bezisync
              readOnly: true
            - name: rc-home
              mountPath: /home/rc
      containers:
        - name: bezisync-register
          image: python:3.13.18-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-I", "/bezisync/register-bezisync.py"]
          envFrom:
            - configMapRef:
                name: rustfs-bootstrap-config   # BUCKET_NAME, AWS_DEFAULT_REGION
            - configMapRef:
                name: rustfs-bezisync-config
          env:
            - name: PYTHONUNBUFFERED
              value: '1'
            - name: BEZISYNC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-bezisync
                  key: access-key
            - name: BEZISYNC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-bezisync
                  key: secret-key
            # BeziSync's bootstrap admin, copied by CI from BeziSync's own
            # Secret (no Secret -> BeziSync not installed -> skip)
            - name: BEZISYNC_LOGIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: bezisync-login
                  key: email
                  optional: true
            - name: BEZISYNC_LOGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bezisync-login
                  key: password
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534   # nobody
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: bezisync
              mountPath: /bezisync
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rustfs-bootstrap-config
            defaultMode: 0555
        - name: bezisync
          configMap:
            name: rustfs-bezisync-config
            defaultMode: 0555
        - name: rc-home
          emptyDir: {}
