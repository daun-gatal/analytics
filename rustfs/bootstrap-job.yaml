kind: Job
apiVersion: batch/v1
metadata:
  name: rustfs-bootstrap
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs-bootstrap
    app.kubernetes.io/part-of: rustfs
spec:
  # A failed ensure should surface as a failed Job, not retry forever:
  # readiness alone can eat 5m, the three ensure phases retry 6x each.
  backoffLimit: 6
  # readiness (≤5m) + ensure phases + the per-node catalog fallback (≤17m)
  activeDeadlineSeconds: 1800
  # Garbage-collect the completed Job after an hour — the next rustfs/all
  # apply re-creates it, so every deploy re-verifies the default bucket
  # state (and it self-heals after PVC wipes).
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-bootstrap
        app.kubernetes.io/part-of: rustfs
    spec:
      # Never (not OnFailure): a failed attempt keeps its pod, so CI's
      # wait_job can still print why it failed (OnFailure pods are deleted
      # with their logs once backoffLimit is hit).
      restartPolicy: Never
      # Steps run in order; each must succeed before the next starts:
      #   1. bootstrap         `datalake` table bucket (every node) + plain
      #                        `lakehouse` bucket (bootstrap.sh)
      #   2. iam               RustFS policies + users for BeziSync and
      #                        Polaris (iam.sh, rustfs/iam-config.yaml)
      initContainers:
        - name: bootstrap
          # curl >= 7.76 is required for --aws-sigv4 (pinned 8.x)
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "/config/bootstrap.sh"]
          envFrom:
            - configMapRef:
                name: rustfs-bootstrap-config
            - secretRef:
                name: rustfs-credentials   # created by CI in ns rustfs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # curlimages/curl declares USER "curl_user" (non-numeric), which
            # the kubelet cannot verify as non-root — pin the numeric UID/GID.
            runAsUser: 100    # curl_user
            runAsGroup: 101   # curl_users
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: iam
          image: rustfs/rc:v0.1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "/iam/iam.sh"]
          envFrom:
            - configMapRef:
                name: rustfs-iam-config
            - secretRef:
                name: rustfs-credentials   # root keys, created by CI
          env:
            - name: HOME             # rc keeps its alias config here
              value: /home/rc
            - name: BEZISYNC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-bezisync
                  key: access-key
            - name: BEZISYNC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-bezisync
                  key: secret-key
            - name: POLARIS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-polaris
                  key: access-key
            - name: POLARIS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-polaris
                  key: secret-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100    # rc
            runAsGroup: 101   # rc
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: iam
              mountPath: /iam
              readOnly: true
            - name: rc-home
              mountPath: /home/rc
      volumes:
        - name: config
          configMap:
            name: rustfs-bootstrap-config
            defaultMode: 0555
        - name: iam
          configMap:
            name: rustfs-iam-config
            defaultMode: 0555
        - name: rc-home
          emptyDir: {}
