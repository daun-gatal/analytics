kind: Service
apiVersion: v1
metadata:
  name: duckdb
  namespace: analytics
  # Not on the tailnet by default — Metabase reaches it in-cluster. Opt in
  # per run with the workflow input tailscale_expose=duckdb|all
  # (component: tailscale/duckdb).
spec:
  ports:
    - name: postgres
      protocol: TCP
      port: 5433
      targetPort: postgres
    - name: flight
      protocol: TCP
      port: 31337
      targetPort: flight
  selector:
    app: duckdb
