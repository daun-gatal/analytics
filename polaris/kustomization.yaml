apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres.yaml
  - setup-config.yaml
  - setup-job.yaml
  - console.yaml

helmCharts:
  - name: polaris
    repo: https://downloads.apache.org/polaris/helm-chart
    # Validated on 2026-11-10 against RustFS 1.0.4 + DuckDB 2.0.0 +
    # pyiceberg 0.10.0 (scratch namespace): relational-jdbc bootstrap,
    # catalog/roles/principals setup, writer create/append/evolve, reader
    # read-only, no credential vending, DuckDB OAuth2 token refresh.
    version: 1.8.0
    releaseName: polaris
    namespace: polaris
    valuesFile: helm.yaml

images:
  # Polaris Console, built by its own workflow (polaris-console.yaml, run
  # by hand) from apache/polaris-tools. The package holds exactly ONE image,
  # :latest (every run deletes the others); the commit it was built from is
  # in the image's org.opencontainers.image.revision label. Published as a
  # PUBLIC package (the first push creates it private: flip it once).
  - name: polaris-console
    newName: ghcr.io/daun-gatal/analytics/polaris-console
    newTag: latest
