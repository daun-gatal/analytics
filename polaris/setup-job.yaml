kind: Job
apiVersion: batch/v1
metadata:
  name: polaris-setup
  namespace: polaris
  labels:
    app.kubernetes.io/name: polaris-setup
    app.kubernetes.io/part-of: polaris
spec:
  # A failed ensure should surface as a failed Job, not retry forever.
  backoffLimit: 3
  # Polaris startup (≤10m wait in setup-polaris.py) + setup
  activeDeadlineSeconds: 1200
  # The next polaris/all apply re-creates it, so every deploy re-verifies
  # the catalog, grants and principal credentials.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polaris-setup
        app.kubernetes.io/part-of: polaris
    spec:
      # Never (not OnFailure): a failed attempt keeps its pod, so CI's
      # wait_job can still print why it failed.
      restartPolicy: Never
      # catalog `lakehouse`, roles, grants, principals (setup-polaris.py).
      # The BeziSync `analytics-lakehouse` destination is registered by bezisync-lab.
      containers:
        - name: catalog
          image: python:3.13.18-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-I", "/setup/setup-polaris.py"]
          envFrom:
            - configMapRef:
                name: polaris-setup-config
          env:
            - name: PYTHONUNBUFFERED
              value: '1'
            - name: POLARIS_ROOT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: polaris-root
                  key: client-id
            - name: POLARIS_ROOT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-root
                  key: client-secret
            - name: POLARIS_DUCKDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: polaris-duckdb
                  key: client-id
            - name: POLARIS_DUCKDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-duckdb
                  key: client-secret
            - name: POLARIS_BEZISYNC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: polaris-bezisync
                  key: client-id
            - name: POLARIS_BEZISYNC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-bezisync
                  key: client-secret
            - name: POLARIS_MAINTENANCE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: polaris-maintenance
                  key: client-id
            - name: POLARIS_MAINTENANCE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-maintenance
                  key: client-secret
            - name: POLARIS_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: polaris-admin
                  key: client-id
            - name: POLARIS_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-admin
                  key: client-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534   # nobody
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: setup
              mountPath: /setup
              readOnly: true
      volumes:
        - name: setup
          configMap:
            name: polaris-setup-config
            defaultMode: 0555
