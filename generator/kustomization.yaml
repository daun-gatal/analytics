apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - generator-settings.yaml
  - stream/deployment.yaml
  - batch/cronjob.yaml

images:
  # Built by the build-image job in .github/workflows/deploy.yaml and
  # published as a PUBLIC package — no pull secret needed in-cluster.
  - name: generator
    newName: ghcr.io/daun-gatal/analytics/generator
    newTag: latest
