name: Deploy Analytics

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to operate on'
        required: true
        type: choice
        options:
          - all
          - duckdb
          - rustfs
          - maintenance
          - generator
        default: all
      action:
        description: 'Kubectl Action'
        required: true
        type: choice
        default: diff
        options:
          - apply
          - diff
          - delete
          - dry-run
          - restart
          - logs
          - probe
          - sigprobe
          - trigger
          - repair
      force_rebuild:
        description: 'Rebuild both images even if unchanged since last push'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      action:
        required: true
        type: string
      force_rebuild:
        required: false
        type: boolean
        default: false


jobs:
  build-image:
    # Builds the Iceberg maintenance Spark image and the data generator
    # image, publishing both as PUBLIC GHCR packages — the cluster pulls
    # them without a pull secret.
    # Note: the very first push creates a package PRIVATE; flip it to
    # public once (GitHub → Packages → <name> → visibility).
    #
    # Builds are change-gated per image: every push tags the image with
    # its commit sha, so GHCR itself records what was already published.
    # The newest ancestor commit holding a :sha tag of the image is the
    # published state — diff that commit→HEAD over the image's input
    # paths; no changes → the image is identical → skip the build and
    # :latest keeps serving the right bytes:
    #   iceberg-maintenance → maintenance/image/**
    #   generator           → generator/** minus *.yaml (the Dockerfile
    #                         and the two baked-in .py scripts; kustomize
    #                         manifests are not part of the image)
    # Detection is fail-open (any registry/git hiccup keeps the build),
    # and `force_rebuild` bypasses it. Read-only actions skip the job
    # entirely: the maintenance script ships via ConfigMap (no image
    # rebuild), so the fix loop iterates on logs/trigger/sigprobe in
    # ~2-3 min instead of ~10. Run an `apply` after touching
    # maintenance/image/Dockerfile — detection picks it up; no force needed.
    if: ${{ !(inputs.action == 'logs' || inputs.action == 'trigger' || inputs.action == 'sigprobe') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # change detection walks ancestor commits looking for each
          # image's last-pushed :sha tag — needs the full history
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skip an image's build when GHCR already has it: the registry has
      # a :sha tag for a commit whose image-input files are identical to
      # HEAD (two imagetools probes minimum, usually one per image).
      - name: Detect images already up to date
        id: changes
        # fail-open: a detection glitch must never block a real build
        continue-on-error: true
        run: |
          set -u
          REPO="${GITHUB_REPOSITORY,,}"

          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "▸ force_rebuild — building both images"
            echo "maintenance=1" >> "$GITHUB_OUTPUT"
            echo "generator=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # newest ancestor commit of HEAD with a :${sha} tag of this
          # image on GHCR (= the content :latest serves right now)
          last_pushed() {
            for sha in $(git rev-list --max-count=40 "${GITHUB_SHA}"); do
              if docker buildx imagetools inspect "ghcr.io/${REPO}/$1:${sha}" >/dev/null 2>&1; then
                printf '%s\n' "${sha}"
                return 0
              fi
            done
            return 1
          }

          # gate <image> <label> -- <git pathspecs…>: sets <label>=0 when
          # the published image is already identical, <label>=1 to build
          gate() {
            local image="$1" label="$2" last=""
            shift 2
            if ! last="$(last_pushed "${image}")"; then
              echo "▸ ${label}: no pushed :sha tag in the last 40 commits — building"
              echo "${label}=1" >> "$GITHUB_OUTPUT"
            elif [ -z "$(git diff --name-only "${last}" "${GITHUB_SHA}" -- "$@")" ]; then
              echo "▸ ${label}: image already up to date with ${last:0:7} — skipping build"
              echo "${label}=0" >> "$GITHUB_OUTPUT"
            else
              echo "▸ ${label}: image inputs changed since ${last:0:7}:"
              git diff --name-only "${last}" "${GITHUB_SHA}" -- "$@" | sed 's/^/    /'
              echo "${label}=1" >> "$GITHUB_OUTPUT"
            fi
          }

          # the whole context dir IS the image
          gate iceberg-maintenance maintenance -- maintenance/image
          # generator: everything under generator/ except the kustomize
          # yaml (manifests don't end up in the image)
          gate generator generator -- generator ':(exclude)generator/*.yaml'

      - name: Build and push
        if: ${{ steps.changes.outputs.maintenance != '0' }}
        uses: docker/build-push-action@v6
        with:
          context: maintenance/image
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/iceberg-maintenance:latest
            ghcr.io/${{ github.repository }}/iceberg-maintenance:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push generator
        if: ${{ steps.changes.outputs.generator != '0' }}
        uses: docker/build-push-action@v6
        with:
          context: generator
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/generator:latest
            ghcr.io/${{ github.repository }}/generator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  execute:
    needs: build-image
    # always() + result check: build-image is skipped for read-only actions
    # (logs/trigger/sigprobe) and execute must still run in that case —
    # while a real build FAILURE still stops the pipeline. Change-gated
    # builds (both steps skipped inside the job) still count as success.
    if: ${{ always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      MODULE_PATH: ${{ inputs.module == 'all' && '.' || inputs.module }}
      K8S_ACTION: ${{ inputs.action }}
      RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
      RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
      DUCKFLIGHT_USER: ${{ secrets.DUCKFLIGHT_USER }}
      DUCKFLIGHT_PASSWORD: ${{ secrets.DUCKFLIGHT_PASSWORD }}
    steps:
      - name: Validate module
        run: |
          case "${MODULE_PATH}" in
            .|duckdb|rustfs|maintenance|generator) ;;
            *) echo "❌ Invalid module '${MODULE_PATH}' (allowed: all, duckdb, rustfs, maintenance, generator)" && exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Setup Helm
        # required: kubectl kustomize delegates helmCharts inflation to the helm binary
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Setup Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tags: tag:git

      - name: Write Kubeconfig
        run: |
          mkdir -p ~/.kube
          # use printf to preserve multiline YAML exactly
          printf '%s' "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          if ! grep -q "server:" ~/.kube/config; then
            echo "❌ KUBECONFIG secret empty or invalid — check GitHub Secrets KUBECONFIG"
            ls -lh ~/.kube/config
            wc -l ~/.kube/config || true
            exit 1
          fi
          echo "Kubeconfig server:"
          grep -E "server:" ~/.kube/config || true
          # export for this and next steps
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
          export KUBECONFIG=$HOME/.kube/config
          kubectl cluster-info || true
          kubectl get ns analytics || echo "Namespace analytics not found (will be created if namespace.yaml included)"

      - name: Ensure Namespaces
        run: |
          for NS in analytics rustfs; do
            echo "→ ensuring namespace/$NS"
            kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Create Secrets from GitHub Secrets
        run: |
          kubectl create secret generic rustfs-credentials -n rustfs \
            --from-literal=RUSTFS_ACCESS_KEY="${RUSTFS_ACCESS_KEY}" \
            --from-literal=RUSTFS_SECRET_KEY="${RUSTFS_SECRET_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic rustfs-credentials -n analytics \
            --from-literal=RUSTFS_ACCESS_KEY="${RUSTFS_ACCESS_KEY}" \
            --from-literal=RUSTFS_SECRET_KEY="${RUSTFS_SECRET_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic duckflight-auth -n analytics \
            --from-literal=username="${DUCKFLIGHT_USER}" \
            --from-literal=password="${DUCKFLIGHT_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Kustomize Build
        run: |
          echo "▶ Building ${MODULE_PATH}"
          # --enable-helm is required: rustfs/ inflates the rustfs helm chart via the helm binary
          kubectl kustomize --enable-helm "${MODULE_PATH}" > /tmp/built.yaml
          echo "Built $(grep -c "^kind:" /tmp/built.yaml) resources"
          head -n 80 /tmp/built.yaml

      - name: Execute Action
        run: |
          set -e
          TARGET="${MODULE_PATH}"
          echo "Target: $TARGET  Action: $K8S_ACTION"
          case "${K8S_ACTION}" in
            apply)
              echo "▶ Applying $TARGET"
              kubectl apply -f /tmp/built.yaml
              case "$TARGET" in
                "."|all|rustfs)
                  # Job/rustfs-bootstrap ensures the default bucket exists
                  # and is enabled as an S3 table bucket (idempotent — see
                  # rustfs/bootstrap-config.yaml). Its ttlSecondsAfterFinished
                  # re-creates it on every rustfs/all apply, so this wait is
                  # the deploy-time guarantee that the lake is query-ready.
                  # Poll in short slices like the `trigger` action:
                  # 'kubectl wait --for=condition=complete' alone blocks the
                  # full timeout on a FAILED job.
                  if kubectl get job/rustfs-bootstrap -n rustfs >/dev/null 2>&1; then
                    echo "▶ Waiting for rustfs-bootstrap (default bucket + table bucket)"
                    DEADLINE=$(( $(date +%s) + 600 ))
                    JOB_OK=""
                    while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                      if kubectl wait --for=condition=complete --timeout=10s job/rustfs-bootstrap -n rustfs >/dev/null 2>&1; then
                        JOB_OK=1
                        break
                      fi
                      if kubectl wait --for=condition=failed --timeout=1s job/rustfs-bootstrap -n rustfs >/dev/null 2>&1; then
                        break
                      fi
                    done
                    if [ -z "$JOB_OK" ]; then
                      kubectl logs job/rustfs-bootstrap -n rustfs --tail=100 --prefix=true || true
                      echo "❌ rustfs-bootstrap did not complete — see logs above"
                      exit 1
                    fi
                    echo "✅ rustfs-bootstrap completed"
                  fi
                  ;;
              esac
              echo "▶ Syncing duckdb with deployed rustfs"
              bash scripts/sync-duckdb-rustfs.sh
              ;;
            diff)
              echo "▶ Diff $TARGET (like terraform refresh)"
              # diff exits 1 when changes exist — don't fail job
              kubectl diff -f /tmp/built.yaml || true
              ;;
            dry-run)
              echo "▶ Dry-run client+server $TARGET"
              kubectl apply --dry-run=client -f /tmp/built.yaml
              kubectl apply --dry-run=server -f /tmp/built.yaml || true
              ;;
            delete)
              echo "▶ Deleting $TARGET (reverse order: rustfs -> duckdb -> namespace)"
              kubectl delete -f /tmp/built.yaml --ignore-not-found=true --wait=true
              ;;
            restart)
              echo "▶ Rollout restart for $TARGET"
              # Array of fully-qualified targets — each entry is passed to
              # kubectl as ONE unit ("kind/name -n ns"), unlike the previous
              # space-joined string that word-split into broken invocations.
              case "$TARGET" in
                "."|all)
                  TARGETS=("deployment/duckdb -n analytics" "statefulset/rustfs -n rustfs" "cronjob/iceberg-maintenance-daily -n analytics" "deployment/generator-stream -n analytics" "cronjob/generator-batch -n analytics")
                  ;;
                duckdb) TARGETS=("deployment/duckdb -n analytics") ;;
                rustfs) TARGETS=("statefulset/rustfs -n rustfs") ;;
                maintenance) TARGETS=("cronjob/iceberg-maintenance-daily -n analytics") ;;
                generator)
                  TARGETS=("deployment/generator-stream -n analytics" "cronjob/generator-batch -n analytics")
                  ;;
                *) TARGETS=("$TARGET") ;;
              esac
              for OBJ in "${TARGETS[@]}"; do
                echo "→ kubectl rollout restart $OBJ"
                kubectl rollout restart $OBJ
                echo "→ waiting for $OBJ"
                kubectl rollout status $OBJ --timeout=180s || true
              done
              echo "▶ Syncing duckdb with deployed rustfs"
              bash scripts/sync-duckdb-rustfs.sh
              kubectl get pods -n analytics
              ;;
            logs)
              echo "▶ Dumping recent logs for $TARGET"
              case "$TARGET" in
                "."|all) TARGETS=("deployment/duckdb -n analytics" "deployment/generator-stream -n analytics") ;;
                duckdb) TARGETS=("deployment/duckdb -n analytics") ;;
                rustfs) TARGETS=("statefulset/rustfs -n rustfs" "job/rustfs-bootstrap -n rustfs") ;;
                generator) TARGETS=("deployment/generator-stream -n analytics") ;;
                # maintenance has no long-running pod — its evidence lives in
                # the cronjob status + job listings below.
                maintenance) TARGETS=() ;;
                *) TARGETS=("$TARGET") ;;
              esac
              echo "→ cronjob schedules in analytics"
              kubectl get cronjobs -n analytics || true
              for OBJ in "${TARGETS[@]}"; do
                echo "→ kubectl logs $OBJ --tail=400"
                kubectl logs $OBJ --tail=400 --prefix=true || true
              done
              echo "→ recent jobs in analytics (last 4)"
              kubectl get jobs -n analytics --sort-by=.metadata.creationTimestamp | tail -4 || true
              # newest two jobs (generator-batch / maintenance runs) with logs.
              # 'kubectl logs job/…' silently picks ONE pod — a retried job's
              # other attempt (backoffLimit: 1) keeps its traceback invisible.
              # Loop the pods of each job instead.
              for JOB in $(kubectl get jobs -n analytics --sort-by=.metadata.creationTimestamp -o name | tail -2); do
                echo "→ job ${JOB}"
                kubectl get job "$JOB" -n analytics -o wide || true
                for POD in $(kubectl get pods -n analytics --selector="job-name=${JOB#job/}" -o name); do
                  echo "→ kubectl logs $POD --tail=2000"
                  kubectl logs -n analytics "$POD" --tail=2000 --prefix=true || true
                done
              done
              ;;
            probe)
              echo "▶ In-cluster auth probe for $TARGET"
              case "$TARGET" in
                generator)
                  echo "→ pod image digest:"
                  kubectl get pods -n analytics -o jsonpath='{range .items[*]}{.metadata.name}{"  "}{.spec.containers[0].image}{"  "}{.status.containerStatuses[0].imageID}{"\n"}{end}' | grep generator || true
                  kubectl exec -i -n analytics deploy/generator-stream -- python3 - <<'PYEOF'
          import hashlib
          import os
          import sys
          import traceback

          print("python:", sys.version.split()[0], flush=True)

          for f in ("/opt/generator/streaming.py", "/opt/generator/batch.py"):
              try:
                  data = open(f, "rb").read()
                  print(f, "sha256:", hashlib.sha256(data).hexdigest()[:16],
                        "len:", len(data), flush=True)
              except Exception as e:
                  print(f, "MISSING:", e, flush=True)

          src = open("/opt/generator/streaming.py").read()
          for needle in ("rest.sigv4-enabled", "client.access-key-id", "import boto3",
                         "GENERATOR_DRY_RUN", "RUSTFS_ENDPOINT_HOST"):
              print("streaming.py contains", repr(needle), ":", needle in src, flush=True)

          print("--- env var names (values hidden) ---", flush=True)
          for k in sorted(os.environ):
              if k.startswith(("GENERATOR_", "RUSTFS_", "DUCKDB_")):
                  v = os.environ[k]
                  print("  ", k, "set, len", len(v), flush=True)

          print("--- real load_iceberg_catalog from the running script ---", flush=True)
          sys.path.insert(0, "/opt/generator")
          import streaming  # noqa: E402

          try:
              cat = streaming.load_iceberg_catalog()
              print("catalog loaded OK:", type(cat).__name__, flush=True)
          except Exception:
              traceback.print_exc()
              sys.stdout.flush()

          print("--- catalog_properties dict (secrets redacted) ---", flush=True)
          try:
              props = streaming.catalog_properties()
              safe = {}
              for k, v in props.items():
                  safe[k] = v if not any(s in k for s in ("access-key", "secret-access")) else "<len %d>" % len(v)
              print(safe, flush=True)
          except Exception:
              traceback.print_exc()
          PYEOF
                  ;;
                *) echo "❌ probe not supported for $TARGET" && exit 1 ;;
              esac
              ;;
            sigprobe)
              # Replays the exact REST requests the Spark maintenance job
              # makes, signed with botocore SigV4 from inside the cluster
              # (via the generator pod, which has boto3). Isolates whether
              # RustFS SignatureDoesNotMatch is path-dependent or
              # header-dependent by varying one factor at a time.
              echo "▶ SigV4 replay probe for $TARGET"
              case "$TARGET" in
                maintenance)
                  kubectl exec -i -n analytics deploy/generator-stream -- python3 - <<'PYEOF'
          import os
          import urllib.error
          import urllib.request

          from botocore.auth import S3SigV4Auth
          from botocore.awsrequest import AWSRequest
          from botocore.credentials import Credentials

          base = "http://rustfs-svc.rustfs.svc.cluster.local:9000"
          creds = Credentials(os.environ["RUSTFS_ACCESS_KEY"], os.environ["RUSTFS_SECRET_KEY"])

          # Header sets: botocore-minimal vs Java-client-shaped (Iceberg
          # HTTPClient adds these base headers to every request).
          java_headers = {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "X-Iceberg-Client-Version": "1.11.0",
              "X-Iceberg-Client-Git-Commit-Short": "deadbee",
              "User-Agent": "aws-sdk-java/1.11.0",
          }

          requests_matrix = [
              ("list-namespaces, minimal headers", "/iceberg/v1/datalake/namespaces?pageToken=", None),
              ("list-namespaces, java headers", "/iceberg/v1/datalake/namespaces?pageToken=", java_headers),
              ("list-tables, minimal headers", "/iceberg/v1/datalake/namespaces/events/tables?pageToken=", None),
              ("list-tables, java headers", "/iceberg/v1/datalake/namespaces/events/tables?pageToken=", java_headers),
              ("list-tables, no query", "/iceberg/v1/datalake/namespaces/events/tables", None),
              ("get-config, java headers", "/iceberg/v1/config?warehouse=datalake", java_headers),
              ("load-table, java headers", "/iceberg/v1/datalake/namespaces/events/tables/wikipedia_edits", java_headers),
          ]

          for label, path, extra in requests_matrix:
              url = base + path
              req = AWSRequest(method="GET", url=url, headers=dict(extra or {}), data=b"")
              S3SigV4Auth(creds, "s3", "us-east-1").add_auth(req)
              sent_headers = {k.lower(): v for k, v in req.headers.items()}
              signed = sent_headers.get("authorization", "")
              signed_headers_list = ""
              for part in signed.split(","):
                  part = part.strip()
                  if part.startswith("SignedHeaders="):
                      signed_headers_list = part[len("SignedHeaders="):]
              try:
                  r = urllib.request.Request(url, headers=sent_headers)
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      print(f"[{label}] HTTP {resp.status} signed={signed_headers_list}", flush=True)
                      # load-table: dump the FULL body — the inline table
                      # metadata JSON feeds the offline RustFS-validator diff
                      limit = 100000 if label.startswith("load-table") else 160
                      print("   body:", resp.read(limit), flush=True)
              except urllib.error.HTTPError as e:
                  print(f"[{label}] HTTP {e.code} signed={signed_headers_list}", flush=True)
                  print("   body:", e.read(1000), flush=True)
              except Exception as e:
                  print(f"[{label}] ERROR {e}", flush=True)

          # ── per-table load status + raw metadata JSON dump ────────────
          # The maintenance job 500s on 'persisted table metadata is
          # invalid' for SOME tables (db.events works, others don't).
          # Load every table, then fetch each table's newest persisted
          # metadata file straight from object storage (boto3, path-style)
          # so the JSON can be diffed against RustFS's validator rules.
          import boto3
          import botocore.config
          import json as jsonlib

          s3 = boto3.client(
              "s3",
              endpoint_url=base,
              region_name="us-east-1",
              aws_access_key_id=os.environ["RUSTFS_ACCESS_KEY"],
              aws_secret_access_key=os.environ["RUSTFS_SECRET_KEY"],
              config=botocore.config.Config(s3={"addressing_style": "path"}),
          )

          tables = [
              ("db", "events"),
              ("events", "bluesky_posts"),
              ("events", "wikipedia_edits"),
              ("web", "github_events"),
              ("web", "wikimedia_pageviews"),
          ]
          for ns, table in tables:
              rest_path = f"/iceberg/v1/datalake/namespaces/{ns}/tables/{table}"
              req = AWSRequest(method="GET", url=base + rest_path, headers=dict(java_headers), data=b"")
              S3SigV4Auth(creds, "s3", "us-east-1").add_auth(req)
              try:
                  r = urllib.request.Request(base + rest_path, headers={k.lower(): v for k, v in req.headers.items()})
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      body = jsonlib.loads(resp.read())
                      location = body.get("metadata-location", "<none>")
                      print(f"[load {ns}.{table}] HTTP 200 location={location}", flush=True)
                      has_inline = "metadata" in body and bool(body["metadata"])
                      print(f"[load {ns}.{table}] inline metadata present: {has_inline}", flush=True)
                      if has_inline and (ns, table) in (("db", "events"), ("events", "bluesky_posts")):
                          meta = body["metadata"]
                          print(f"[meta {ns}.{table}] inline metadata top-level keys: {sorted(meta.keys())}", flush=True)
                          for field in ("format-version", "last-sequence-number", "last-updated-ms", "last-column-id",
                                        "current-schema-id", "default-spec-id", "last-partition-id"):
                              print(f"[meta {ns}.{table}] {field}={meta.get(field, '<ABSENT>')}", flush=True)
                          for field in ("schemas", "partition-specs", "sort-orders", "snapshot-log", "metadata-log"):
                              value = meta.get(field)
                              print(f"[meta {ns}.{table}] {field}: {'ABSENT' if value is None else (len(value) if isinstance(value, list) else type(value).__name__)}", flush=True)
              except urllib.error.HTTPError as e:
                  print(f"[load {ns}.{table}] HTTP {e.code}: {e.read(300)}", flush=True)
              except Exception as e:
                  print(f"[load {ns}.{table}] ERROR {e}", flush=True)

              # the pointer route (GET_TABLE_METADATA_LOCATION) should not
              # validate the metadata — it gives the exact key even for the
              # broken tables; fetch THAT file raw from object storage.
              req = AWSRequest(method="GET", url=base + rest_path + "/metadata-location", headers=dict(java_headers), data=b"")
              S3SigV4Auth(creds, "s3", "us-east-1").add_auth(req)
              try:
                  r = urllib.request.Request(base + rest_path + "/metadata-location",
                                             headers={k.lower(): v for k, v in req.headers.items()})
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      pointer_body = jsonlib.loads(resp.read())
                      location = pointer_body.get("metadata-location", "")
                      print(f"[ptr {ns}.{table}] {location}", flush=True)
              except urllib.error.HTTPError as e:
                  print(f"[ptr {ns}.{table}] HTTP {e.code}: {e.read(200)}", flush=True)
                  continue
              except Exception as e:
                  print(f"[ptr {ns}.{table}] ERROR {e}", flush=True)
                  continue

              if not location.startswith("s3://datalake/"):
                  print(f"[meta {ns}.{table}] unexpected location scheme: {location}", flush=True)
                  continue
              key = location[len("s3://datalake/"):]
              try:
                  obj = s3.get_object(Bucket="datalake", Key=key)
                  data = obj["Body"].read()
                  print(f"[meta {ns}.{table}] {key} ({len(data)} bytes)", flush=True)
                  if (ns, table) in (("events", "wikipedia_edits"), ("web", "github_events")):
                      # broken tables: dump the FULL metadata for offline diff
                      print("METADATA-JSON-START", flush=True)
                      print(data.decode("utf-8", "replace"), flush=True)
                      print("METADATA-JSON-END", flush=True)
              except Exception as e:
                  print(f"[meta {ns}.{table}] ERROR {e}", flush=True)

          # ── dangling-pointer forensics ────────────────────────────────
          # The broken tables point at metadata files that 404 (NoSuchKey).
          # 1) is the hidden .rustfs-table prefix listable at all?
          # 2) does the metadata file that was current yesterday still exist
          #    (pointer could be repaired back to it)?
          for ns, table in (("events", "wikipedia_edits"), ("web", "github_events")):
              prefix = f".rustfs-table/warehouses/default/namespaces/{ns}/tables/{table}/"
              try:
                  listed = s3.list_objects_v2(Bucket="datalake", Prefix=prefix)
                  keys = [o["Key"] for o in listed.get("Contents", [])]
                  print(f"[ls {ns}.{table}] {len(keys)} object(s) under {prefix}", flush=True)
                  meta_keys = sorted(k for k in keys if ".metadata.json" in k)
                  for k in meta_keys[-5:]:
                      print(f"[ls {ns}.{table}]   {k}", flush=True)
                  if meta_keys:
                      newest = meta_keys[-1]
                      obj = s3.get_object(Bucket="datalake", Key=newest)
                      data = obj["Body"].read()
                      print(f"[repair-candidate {ns}.{table}] {newest} ({len(data)} bytes) exists and is readable", flush=True)
              except Exception as e:
                  print(f"[ls {ns}.{table}] ERROR {e}", flush=True)

          # known pointer of events.wikipedia_edits as of yesterday's probe
          known = ".rustfs-table/warehouses/default/namespaces/events/tables/wikipedia_edits/metadata/00164-4b3f842a-7b37-4089-b2bd-0b992d66b4a.metadata.json"
          try:
              obj = s3.get_object(Bucket="datalake", Key=known)
              data = obj["Body"].read()
              print(f"[known-key wikipedia_edits] EXISTS ({len(data)} bytes)", flush=True)
          except Exception as e:
              print(f"[known-key wikipedia_edits] {e}", flush=True)
          PYEOF
                  ;;
                *) echo "❌ sigprobe not supported for $TARGET" && exit 1 ;;
              esac
              ;;
            trigger)
              # Fire a CronJob once, right now — verification without waiting
              # for the schedule (e.g. maintenance-daily at 02:00 UTC).
              echo "▶ Triggering $TARGET"
              case "$TARGET" in
                maintenance) CRON="cronjob/iceberg-maintenance-daily -n analytics" ;;
                generator-batch) CRON="cronjob/generator-batch -n analytics" ;;
                *) echo "❌ trigger not supported for $TARGET" && exit 1 ;;
              esac
              STAMP=$(date -u +%Y%m%d-%H%M%S)
              JOB="manual-$TARGET-$STAMP"
              kubectl create job --from=$CRON "$JOB" -n analytics
              echo "→ created job $JOB; watching it (max 15m)"

              # Poll in short slices: 'kubectl wait --for=condition=complete'
              # ignores FAILED jobs and used to block the full 480s even
              # though the pod died in the first 30s. 'failed' is a real
              # Job condition, so both outcomes break the loop immediately.
              # 30 min cap: a healthy cycle over backfilled tables takes
              # several minutes of real Spark work (orphan scans run
              # 480-task stages), so the old 8 min wait was never enough.
              DEADLINE=$(( $(date +%s) + 1800 ))
              JOB_OK=""
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                if kubectl wait --for=condition=complete --timeout=10s "job/$JOB" -n analytics >/dev/null 2>&1; then
                  JOB_OK=1
                  break
                fi
                if kubectl wait --for=condition=failed --timeout=1s "job/$JOB" -n analytics >/dev/null 2>&1; then
                  break
                fi
              done

              # Evidence: status + logs of EVERY pod of the job (both
              # attempts; 'kubectl logs job/…' reads only the newest pod,
              # and a short tail hides the top of tracebacks — the part
              # with the actual error message).
              echo "→ job/$JOB status:"
              kubectl get job "$JOB" -n analytics -o wide || true
              kubectl get pods -n analytics --selector="job-name=$JOB" -o wide || true
              for POD in $(kubectl get pods -n analytics --selector="job-name=$JOB" -o name); do
                echo "→ kubectl logs $POD --tail=20000"
                kubectl logs -n analytics "$POD" --tail=20000 --prefix=true || true
              done

              if [ -z "$JOB_OK" ]; then
                echo "❌ $JOB did not complete successfully"
                exit 1
              fi
              echo "✅ $JOB completed"
              ;;
            repair)
              # Drop tables whose catalog entries RustFS 1.0.0 broke
              # (dangling metadata pointers, "persisted table metadata is
              # invalid" on every load). The generators recreate them on
              # their next cycle/trigger; the S3 data files stay in place.
              echo "▶ Repairing broken catalog entries for $TARGET"
              case "$TARGET" in
                maintenance)
                  kubectl exec -i -n analytics deploy/generator-stream -- python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, "/opt/generator")

          from pyiceberg.catalog import load_catalog

          import streaming

          catalog = load_catalog(streaming.CATALOG_NAME, **streaming.catalog_properties())

          for ident in ("events.wikipedia_edits", "web.github_events"):
              try:
                  catalog.drop_table(ident)
                  print("repair: dropped", ident, flush=True)
              except Exception as e:
                  print("repair: drop failed for", ident, ":", e, flush=True)
          PYEOF
                  echo "→ restarting generator-stream so create_table_if_not_exists recreates the stream tables"
                  kubectl rollout restart deployment/generator-stream -n analytics
                  kubectl rollout status deployment/generator-stream -n analytics --timeout=180s || true
                  echo "→ triggering generator-batch to recreate + backfill the web tables"
                  STAMP=$(date -u +%Y%m%d-%H%M%S)
                  kubectl create job --from=cronjob/generator-batch "manual-generator-batch-$STAMP" -n analytics
                  ;;
                *) echo "❌ repair not supported for $TARGET" && exit 1 ;;
              esac
              ;;
          esac
