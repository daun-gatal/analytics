apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - settings.yaml
  - configmap.yaml
  - cronjob.yaml
  - contracts/connectors.yaml
  - contracts/generator-batch.yaml
  - contracts/generator-stream.yaml

images:
  # Built by the build-image job in .github/workflows/deploy.yaml and
  # published as a PUBLIC package — no pull secret needed in-cluster.
  - name: catalog-sync
    newName: ghcr.io/daun-gatal/analytics/catalog-sync
    newTag: latest
