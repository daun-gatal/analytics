  RECON_ANALYTICS_NS: "analytics"
  RECON_CLUSTER_DOMAIN: "cluster.local"
  RECON_OWNER: "data-platform"
  RECON_SOURCES_SERVICE: "gh_archive"
  RECON_GENERATOR_SERVICE: "lakehouse-generators"
  RECON_WAREHOUSE: "datalake"
