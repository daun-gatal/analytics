kind: ConfigMap
apiVersion: v1
metadata:
  name: maintenance-config
  namespace: analytics
data:
  #
  # Iceberg table maintenance for the lake on RustFS: the `datalake` catalog
  # (RustFS built-in) and, when its principal is set, the Polaris
  # `lakehouse` catalog.
  #
  # maintenance.py runs in the iceberg-maintenance-daily CronJob (Spark
  # local mode) and reads ALL runtime facts from env:
  #   duckdb-settings ConfigMap   -> RUSTFS_PROTOCOL/_HOST/_PORT/_REGION
  #   rustfs-credentials Secret   -> RUSTFS_ACCESS_KEY/_SECRET_KEY
  #   polaris-maintenance Secret  -> POLARIS_MAINTENANCE_CLIENT_ID/_SECRET
  #                                  (principal `maintenance`, lakehouse.writer;
  #                                  optional: absent -> lakehouse skipped)
  #   maintenance-config ConfigMap -> MAINT_* tunables (keys below)
  #
  # Per table: row retention (MAINT_ROW_RETENTION) -> compact data files ->
  # rewrite manifests -> expire snapshots -> remove orphan files (with a
  # grace window for in-flight writes).
  #
  maintenance.py: |
    #!/usr/bin/env python3
    """Iceberg table maintenance for the analytics lake (RustFS + Polaris)."""

    import os
    import re
    import sys
    import traceback
    from datetime import datetime, timedelta, timezone

    from pyspark.sql import SparkSession

    CATALOG = os.getenv("MAINT_CATALOG_NAME", "datalake")
    # The Polaris catalog (polaris module), maintained when the `maintenance`
    # principal's credentials are in env.
    POLARIS_CATALOG = os.getenv("MAINT_POLARIS_CATALOG", "lakehouse")
    # BeziSync's Debezium writer adds the time of each change; append-only
    # change logs are partitioned by its day.
    CHANGE_TS = "__source_ts_ms"

    DURATION_RE = re.compile(r"^\s*(\d+)\s*([dhms])\s*$", re.IGNORECASE)
    DURATION_UNITS = {"d": 86400, "h": 3600, "m": 60, "s": 1}

    BYTES_RE = re.compile(r"^\s*(\d+)\s*([kmgt]?i?b?)\s*$", re.IGNORECASE)
    BYTE_UNITS = {"": 1, "k": 1024, "m": 1024**2, "g": 1024**3, "t": 1024**4}


    def fail(message, missing=None):
        """Fail fast with a clear message — mirror generate-config.sh style."""
        if missing:
            message = f"{message}: {', '.join(missing)}"
        print(f"❌ maintenance: {message}", file=sys.stderr)
        sys.exit(2)


    def parse_seconds(raw, default):
        """'7d' / '72h' / '45m' / '30s' -> seconds; falls back to default."""
        match = DURATION_RE.match(raw or "")
        if not match:
            return default
        return int(match.group(1)) * DURATION_UNITS[match.group(2).lower()]


    def parse_bytes(raw, default):
        """'512MB' / '1GiB' / plain int -> bytes; falls back to default."""
        match = BYTES_RE.match(raw or "")
        if not match:
            return default
        unit = match.group(2).lower().replace("i", "").replace("b", "")
        return int(match.group(1)) * BYTE_UNITS[unit]


    def ts_literal(moment):
        """Spark SQL TIMESTAMP literal, e.g. TIMESTAMP '2026-09-18 02:00:00'."""
        return moment.strftime("%Y-%m-%d %H:%M:%S")


    def discover_tables(spark, catalog):
        """All tables in the catalog, fully qualified as <namespace>.<table>.

        SHOW NAMESPACES returns the 'namespace' column as a flat STRING in
        Spark 4 (nested namespaces unsupported → StringType) — joining it
        with "." iterated its CHARACTERS ("db" → "d.b"), producing a bogus
        multi-level namespace whose %1F wire path then broke the SigV4
        signature (double-encoded). Normalize both possible shapes.
        """
        tables = []
        for ns_row in spark.sql(f"SHOW NAMESPACES IN {catalog}").collect():
            namespace = ns_row["namespace"]
            if not isinstance(namespace, str):
                namespace = ".".join(namespace)
            for t_row in spark.sql(f"SHOW TABLES IN {catalog}.{namespace}").collect():
                tables.append(f"{namespace}.{t_row['tableName']}")
        return tables


    def compact(spark, catalog, table, target_bytes):
        """Bin-pack small data files up to the target size.

        Procedures get the table fully qualified (<catalog>.<ns>.<table>):
        given '<ns>.<table>', Spark first tries <ns> as a catalog and logs a
        CatalogNotFoundException stack trace before falling back.

        partial-progress commits every few file groups so a long compaction
        can be retried without redoing everything.
        """
        result = spark.sql(f"""
            CALL {catalog}.system.rewrite_data_files(
                table => '{catalog}.{table}',
                options => map(
                    'target-file-size-bytes', '{target_bytes}',
                    'partial-progress.enabled', 'true',
                    'partial-progress.max-commits', '5'
                )
            )""").first()
        print(f"    ↺ compact: {result.asDict()}")


    def rewrite_manifests(spark, catalog, table):
        """Consolidate small manifests so scan planning reads fewer files."""
        result = spark.sql(
            f"CALL {catalog}.system.rewrite_manifests(table => '{catalog}.{table}')"
        ).first()
        print(f"    ↺ manifests: {result.asDict()}")


    def expire_snapshots(spark, catalog, table, max_age_seconds, retain_last):
        """Drop snapshots older than the retention window.

        Expired snapshots are removed from metadata and the procedure
        deletes files no longer referenced by any retained snapshot.
        """
        cutoff = datetime.now(timezone.utc) - timedelta(seconds=max_age_seconds)
        result = spark.sql(f"""
            CALL {catalog}.system.expire_snapshots(
                table => '{catalog}.{table}',
                older_than => TIMESTAMP '{ts_literal(cutoff)}',
                retain_last => {int(retain_last)}
            )""").first()
        print(f"    ↺ expire: {result.asDict()}")


    def remove_orphan_files(spark, catalog, table, min_age_seconds):
        """Delete files in the table location that no snapshot references.

        The min-age grace window protects files from writes that are still
        in flight — never set it below the longest expected write.

        prefix_listing => true lists the table location through the
        catalog's S3FileIO (prefix operations) instead of Hadoop fs — the
        Spark image has no hadoop-aws, so the default Hadoop listing dies
        with UnsupportedFileSystemException 'No FileSystem for scheme "s3"'.
        """
        cutoff = datetime.now(timezone.utc) - timedelta(seconds=min_age_seconds)
        result = spark.sql(f"""
            CALL {catalog}.system.remove_orphan_files(
                table => '{catalog}.{table}',
                older_than => TIMESTAMP '{ts_literal(cutoff)}',
                prefix_listing => true
            )""")
        orphans = result.collect()
        print(f"    ↺ orphans: {len(orphans)} file(s) removed")
        for row in orphans[:10]:
            print(f"      - {row['file_path']}")


    def parse_retention(raw):
        """'datalake.cdc=14d,lakehouse.cdc=14d:deleted' ->
        {('datalake', 'cdc'): (seconds, tombstones_only)}.

        <catalog>.<namespace>=<age> deletes change-log rows older than the
        age; ':deleted' limits it to deleted-row markers (upsert tables keep
        their live rows). Malformed entries fail the run: retention deletes
        data, it must never guess.
        """
        rules = {}
        for entry in filter(None, (e.strip() for e in (raw or "").split(","))):
            target, _, rule = entry.partition("=")
            age, _, mode = rule.partition(":")
            catalog, _, namespace = target.strip().partition(".")
            seconds = parse_seconds(age, None)
            if not catalog or not namespace or seconds is None or mode not in ("", "deleted"):
                fail(f"MAINT_ROW_RETENTION: can't parse '{entry}' "
                     "(want <catalog>.<namespace>=<age>[:deleted], e.g. datalake.cdc=14d)")
            rules[(catalog, namespace.strip())] = (seconds, mode == "deleted")
        return rules


    def retain_rows(spark, catalog, table, max_age_seconds, tombstones_only):
        """Delete change-log rows whose change is older than the window.

        Only tables BeziSync's Debezium writer made (they carry __source_ts_ms;
        others are left alone). Append-only change logs are partitioned by its
        day, so old days go as whole partitions. tombstones_only deletes just
        the rows an upsert table keeps marked as deleted (__deleted = 'true').
        """
        columns = {field.name for field in spark.table(f"{catalog}.{table}").schema.fields}
        if CHANGE_TS not in columns:
            print(f"    ↺ retain: no {CHANGE_TS} column, skipped")
            return
        cutoff = datetime.now(timezone.utc) - timedelta(seconds=max_age_seconds)
        where = f"{CHANGE_TS} < TIMESTAMP '{ts_literal(cutoff)}'"
        if tombstones_only:
            if "__deleted" not in columns:
                print("    ↺ retain: no __deleted column, skipped")
                return
            where += " AND __deleted = 'true'"
        before = spark.sql(f"SELECT count(*) AS n FROM {catalog}.{table} WHERE {where}").first()["n"]
        if before == 0:
            print(f"    ↺ retain: nothing older than {ts_literal(cutoff)} UTC")
            return
        spark.sql(f"DELETE FROM {catalog}.{table} WHERE {where}")
        kind = "deleted-row markers" if tombstones_only else "rows"
        print(f"    ↺ retain: {before} {kind} older than {ts_literal(cutoff)} UTC deleted")


    def finish(spark, code):
        """End the run with `code` once Spark has stopped: halt the JVM.

        After spark.stop() the work is flushed, but on this cluster the JVM's
        own shutdown never completes: the driver exits, the JVM (PID 1) keeps
        running, and the Job's pod stays Running, which with
        concurrencyPolicy Forbid blocks every later run (seen 2026-11-10,
        also with the script from before; the node's AppArmor profile, which
        denies signals between processes, is the likely cause). halt() exits
        at once with the code, skipping only shutdown hooks (temp-dir
        cleanup of a throwaway pod).
        """
        sys.stdout.flush()
        sys.stderr.flush()
        try:
            spark._jvm.java.lang.Runtime.getRuntime().halt(code)
        except Exception:  # noqa: BLE001 — the gateway drops as the JVM halts
            pass
        sys.exit(code)


    def main():
        required = [
            "RUSTFS_PROTOCOL",
            "RUSTFS_ENDPOINT_HOST",
            "RUSTFS_ENDPOINT_PORT",
            "RUSTFS_REGION",
            "RUSTFS_ACCESS_KEY",
            "RUSTFS_SECRET_KEY",
        ]
        missing = [name for name in required if not os.getenv(name)]
        if missing:
            fail("empty env vars", missing)

        protocol = os.getenv("RUSTFS_PROTOCOL")
        host = os.getenv("RUSTFS_ENDPOINT_HOST")
        port = os.getenv("RUSTFS_ENDPOINT_PORT")
        region = os.getenv("RUSTFS_REGION")
        rest_uri = f"{protocol}://{host}:{port}/iceberg"
        s3_endpoint = f"{protocol}://{host}:{port}"

        target_bytes = parse_bytes(os.getenv("MAINT_TARGET_FILE_SIZE"), 512 * 1024**2)
        max_age_seconds = parse_seconds(os.getenv("MAINT_SNAPSHOT_MAX_AGE"), 7 * 86400)
        retain_last = int(os.getenv("MAINT_RETAIN_LAST", "10"))
        orphan_min_age = parse_seconds(os.getenv("MAINT_ORPHAN_MIN_AGE"), 3 * 86400)
        retention = parse_retention(os.getenv("MAINT_ROW_RETENTION", ""))

        polaris_url = (os.getenv("MAINT_POLARIS_URL") or "").rstrip("/")
        polaris_id = os.getenv("POLARIS_MAINTENANCE_CLIENT_ID")
        polaris_secret = os.getenv("POLARIS_MAINTENANCE_CLIENT_SECRET")
        catalogs = [CATALOG]
        if polaris_url and polaris_id and polaris_secret:
            catalogs.append(POLARIS_CATALOG)
        else:
            print(f"⏭  {POLARIS_CATALOG}: no Polaris URL or principal (Secret polaris-maintenance) — not maintained")

        builder = (
            SparkSession.builder.appName("iceberg-maintenance")
            .master(os.getenv("MAINT_SPARK_MASTER", "local[2]"))
            # CALL procedures + Iceberg SQL
            .config(
                "spark.sql.extensions",
                "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions",
            )
            # TIMESTAMP literals (retention and expiry cutoffs) are UTC
            .config("spark.sql.session.timeZone", "UTC")
            # No Spark UI: nobody looks at it in a nightly batch (and stopping
            # its Jetty server timed out at shutdown; see finish()).
            .config("spark.ui.enabled", "false")
            # REST catalog over RustFS, SigV4-signed like the DuckDB ATTACH
            .config(f"spark.sql.catalog.{CATALOG}", "org.apache.iceberg.spark.SparkCatalog")
            .config(f"spark.sql.catalog.{CATALOG}.type", "rest")
            .config(f"spark.sql.catalog.{CATALOG}.uri", rest_uri)
            # warehouse is REQUIRED for the RustFS built-in table catalog:
            # its routes are S3Tables-shaped ({prefix}/{warehouse}/namespaces/...)
            # and the config response only returns the `prefix` override when
            # the client sends ?warehouse=... on GET /v1/config. Without it the
            # Java client uses unprefixed spec paths (/v1/namespaces) that
            # match no route and fail with 501 "A header you provided implies
            # functionality that is not implemented". Must match the
            # generator's warehouse (GENERATOR_CATALOG_WAREHOUSE or
            # CATALOG_NAME = 'datalake').
            .config(
                f"spark.sql.catalog.{CATALOG}.warehouse",
                os.getenv("MAINT_CATALOG_WAREHOUSE") or CATALOG,
            )
            .config(f"spark.sql.catalog.{CATALOG}.rest.sigv4-enabled", "true")
            .config(f"spark.sql.catalog.{CATALOG}.rest.signing-name", "s3")
            .config(f"spark.sql.catalog.{CATALOG}.rest.signing-region", region)
            # S3 FileIO pointed at RustFS (endpoint override, path-style)
            .config(
                f"spark.sql.catalog.{CATALOG}.io-impl",
                "org.apache.iceberg.aws.s3.S3FileIO",
            )
            .config(f"spark.sql.catalog.{CATALOG}.s3.endpoint", s3_endpoint)
            .config(f"spark.sql.catalog.{CATALOG}.s3.path-style-access", "true")
            .config(f"spark.sql.catalog.{CATALOG}.s3.region", region)
            .config(
                f"spark.sql.catalog.{CATALOG}.s3.access-key-id",
                os.getenv("RUSTFS_ACCESS_KEY"),
            )
            .config(
                f"spark.sql.catalog.{CATALOG}.s3.secret-access-key",
                os.getenv("RUSTFS_SECRET_KEY"),
            )
            # client.* feeds only the generic AWS SDK clients; the REST
            # catalog SigV4 signer (RESTSigV4AuthSession ->
            # AwsProperties.restCredentialsProvider) reads credentials from
            # the rest.access-key-id / rest.secret-access-key properties
            # specifically. Without rest.* the signer falls back to the AWS
            # SDK credential chain, finds nothing in-cluster, and every
            # catalog request dies with SdkClientException "Unable to load
            # credentials from any of the providers in the chain".
            .config(
                f"spark.sql.catalog.{CATALOG}.rest.access-key-id",
                os.getenv("RUSTFS_ACCESS_KEY"),
            )
            .config(
                f"spark.sql.catalog.{CATALOG}.rest.secret-access-key",
                os.getenv("RUSTFS_SECRET_KEY"),
            )
            # client.* kept as harmless fallbacks for other AWS clients.
            .config(
                f"spark.sql.catalog.{CATALOG}.client.access-key-id",
                os.getenv("RUSTFS_ACCESS_KEY"),
            )
            .config(
                f"spark.sql.catalog.{CATALOG}.client.secret-access-key",
                os.getenv("RUSTFS_SECRET_KEY"),
            )
            .config(f"spark.sql.catalog.{CATALOG}.client.region", region)
            .config("spark.sql.defaultCatalog", CATALOG)
        )
        if POLARIS_CATALOG in catalogs:
            # Polaris REST catalog: OAuth2 client credentials (Iceberg renews
            # the token itself). Polaris vends no credentials (no STS on
            # RustFS), so S3FileIO gets the RustFS keys like datalake's.
            p = f"spark.sql.catalog.{POLARIS_CATALOG}"
            for key, value in {
                "": "org.apache.iceberg.spark.SparkCatalog",
                ".type": "rest",
                ".uri": f"{polaris_url}/api/catalog",
                ".warehouse": POLARIS_CATALOG,
                ".credential": f"{polaris_id}:{polaris_secret}",
                ".scope": "PRINCIPAL_ROLE:ALL",
                ".oauth2-server-uri": f"{polaris_url}/api/catalog/v1/oauth/tokens",
                ".io-impl": "org.apache.iceberg.aws.s3.S3FileIO",
                ".s3.endpoint": s3_endpoint,
                ".s3.path-style-access": "true",
                ".s3.access-key-id": os.getenv("RUSTFS_ACCESS_KEY"),
                ".s3.secret-access-key": os.getenv("RUSTFS_SECRET_KEY"),
                ".client.region": region,
            }.items():
                builder = builder.config(p + key, value)
        spark = builder.getOrCreate()

        # Diagnostics: show what catalog conf actually reached Spark so
        # credential/signing plumbing issues are visible in job logs.
        # spark.conf.getAll is a dict property in PySpark 4.x.
        for conf_key in sorted(dict(spark.conf.getAll)):
            if any(f"catalog.{name}" in conf_key for name in catalogs):
                conf_value = spark.conf.get(conf_key)
                if "access-key" in conf_key or "secret" in conf_key or "credential" in conf_key:
                    conf_value = f"<len {len(conf_value)}>"
                print(f"DEBUG spark conf {conf_key}={conf_value}")
        for env_key in ("RUSTFS_ACCESS_KEY", "RUSTFS_SECRET_KEY", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_REGION"):
            env_value = os.getenv(env_key)
            print(f"DEBUG env {env_key} len={len(env_value) if env_value else 0}")

        # Discovery failure must NOT become a bare crash: the pyspark
        # traceback is the only place that names the REST endpoint the
        # catalog client 501'd on (ResourcePaths / ErrorHandlers frames).
        targets = []  # (catalog, <namespace>.<table>)
        for catalog in catalogs:
            try:
                found = discover_tables(spark, catalog)
            except Exception:  # noqa: BLE001
                print(f"❌ maintenance: table discovery failed in {catalog}", file=sys.stderr)
                traceback.print_exc()
                spark.stop()
                finish(spark, 2)
            print(f"▶ catalog={catalog} tables={len(found)}")
            for table in found:
                print(f"→ {catalog}.{table}")
            targets += [(catalog, table) for table in found]

        failures = []
        skipped = []

        # RustFS 1.0.0 server defects, classified so they don't mask real
        # regressions or fail the whole cronjob forever:
        #
        # - "persisted table metadata is invalid" — the catalog entry points
        #   at a metadata file that no longer exists (dangling pointer, the
        #   table is unreadable server-side). No client-side step can fix
        #   it; the table needs operator repair (drop + recreate). Skip the
        #   whole table.
        # - "row-level snapshot operation requires deleted data files" —
        #   the server rejects overwrite commits that only swap manifests,
        #   so rewrite_manifests can never succeed. Skip the step.
        CATALOG_BROKEN = "persisted table metadata is invalid"
        MANIFEST_REWRITE_REJECTED = "row-level snapshot operation requires deleted data files"

        def run(step_name, step):
            label = f"{catalog}.{table}"
            try:
                step()
            except Exception as error:  # noqa: BLE001 — one bad table must not block the rest
                text = str(error)
                if CATALOG_BROKEN in text:
                    skipped.append(f"{label}: catalog entry broken ({CATALOG_BROKEN}) — needs drop + recreate")
                    print(f"    ⚠ {step_name}: table catalog state is broken, skipping table", file=sys.stderr)
                    return "table"
                if MANIFEST_REWRITE_REJECTED in text:
                    skipped.append(f"{label}/{step_name}: server rejects manifest-rewrite commits ({MANIFEST_REWRITE_REJECTED})")
                    print(f"    ⚠ {step_name}: known server limitation, skipping step", file=sys.stderr)
                    return "step"
                failures.append(f"{label}/{step_name}: {error}")
                print(f"    ✗ {step_name}: {error}", file=sys.stderr)
                traceback.print_exc()
            return None

        for catalog, table in targets:
            print(f"→ {catalog}.{table}")
            rule = retention.get((catalog, table.rsplit(".", 1)[0]))
            if rule:
                outcome = run("retain", lambda: retain_rows(spark, catalog, table, *rule))
                if outcome == "table":
                    continue
            outcome = run("compact", lambda: compact(spark, catalog, table, target_bytes))
            if outcome == "table":
                continue
            outcome = run("manifests", lambda: rewrite_manifests(spark, catalog, table))
            if outcome == "table":
                continue
            outcome = run(
                "expire",
                lambda: expire_snapshots(spark, catalog, table, max_age_seconds, retain_last),
            )
            if outcome == "table":
                continue
            run(
                "orphans",
                lambda: remove_orphan_files(spark, catalog, table, orphan_min_age),
            )

        spark.stop()

        if skipped:
            print(f"⚠ maintenance: {len(skipped)} table/step(s) skipped (server-side):", file=sys.stderr)
            for entry in skipped:
                print(f"   - {entry}", file=sys.stderr)

        if failures:
            print(f"❌ maintenance: {len(failures)} step(s) failed:", file=sys.stderr)
            for failure in failures:
                print(f"   - {failure}", file=sys.stderr)
            finish(spark, 1)
        print("✅ maintenance: all tables up to date")
        finish(spark, 0)


    if __name__ == "__main__":
        main()

  #
  # Tunables — referenced by name from the CronJob's env. Human-friendly
  # units (512MB, 7d) are parsed by maintenance.py.
  #
  MAINT_TARGET_FILE_SIZE: "512MB"   # bin-pack data files up to this size
  MAINT_SNAPSHOT_MAX_AGE: "7d"      # expire snapshots older than this
  MAINT_RETAIN_LAST: "10"           # always keep at least N snapshots
  MAINT_ROW_RETENTION: "datalake.cdc=14d,lakehouse.cdc=14d:deleted"
                                    # <catalog>.<namespace>=<age>[:deleted]: delete
                                    # change-log rows (BeziSync's __source_ts_ms)
                                    # older than <age>; :deleted only the rows an
                                    # upsert table keeps marked deleted. The cdc
                                    # namespaces are the BeziSync lab's writes.
  MAINT_POLARIS_URL: http://polaris.polaris.svc.cluster.local:8181
  MAINT_ORPHAN_MIN_AGE: "72h"       # orphan grace window (files newer than
                                    # this are never deleted, even if unreferenced)
