kind: ConfigMap
apiVersion: v1
metadata:
  name: maintenance-config
  namespace: analytics
data:
  #
  # Iceberg table maintenance for the datalake on RustFS.
  #
  # maintenance.py runs in the iceberg-maintenance-daily CronJob (Spark
  # local mode) and reads ALL runtime facts from env:
  #   duckdb-settings ConfigMap   -> RUSTFS_PROTOCOL/_HOST/_PORT/_REGION
  #   rustfs-credentials Secret   -> RUSTFS_ACCESS_KEY/_SECRET_KEY
  #   maintenance-config ConfigMap -> MAINT_* tunables (keys below)
  #
  # Per table: compact data files -> rewrite manifests -> expire snapshots
  # -> remove orphan files (with a grace window for in-flight writes).
  #
  maintenance.py: |
    #!/usr/bin/env python3
    """Iceberg table maintenance for the analytics datalake (RustFS)."""

    import os
    import re
    import sys
    import traceback
    from datetime import datetime, timedelta, timezone

    from pyspark.sql import SparkSession

    CATALOG = os.getenv("MAINT_CATALOG_NAME", "datalake")

    DURATION_RE = re.compile(r"^\s*(\d+)\s*([dhms])\s*$", re.IGNORECASE)
    DURATION_UNITS = {"d": 86400, "h": 3600, "m": 60, "s": 1}

    BYTES_RE = re.compile(r"^\s*(\d+)\s*([kmgt]?i?b?)\s*$", re.IGNORECASE)
    BYTE_UNITS = {"": 1, "k": 1024, "m": 1024**2, "g": 1024**3, "t": 1024**4}


    def fail(message, missing=None):
        """Fail fast with a clear message — mirror generate-config.sh style."""
        if missing:
            message = f"{message}: {', '.join(missing)}"
        print(f"❌ maintenance: {message}", file=sys.stderr)
        sys.exit(2)


    def parse_seconds(raw, default):
        """'7d' / '72h' / '45m' / '30s' -> seconds; falls back to default."""
        match = DURATION_RE.match(raw or "")
        if not match:
            return default
        return int(match.group(1)) * DURATION_UNITS[match.group(2).lower()]


    def parse_bytes(raw, default):
        """'512MB' / '1GiB' / plain int -> bytes; falls back to default."""
        match = BYTES_RE.match(raw or "")
        if not match:
            return default
        unit = match.group(2).lower().replace("i", "").replace("b", "")
        return int(match.group(1)) * BYTE_UNITS[unit]


    def ts_literal(moment):
        """Spark SQL TIMESTAMP literal, e.g. TIMESTAMP '2026-09-18 02:00:00'."""
        return moment.strftime("%Y-%m-%d %H:%M:%S")


    def discover_tables(spark):
        """All tables in the catalog, fully qualified as <namespace>.<table>.

        SHOW NAMESPACES returns the 'namespace' column as a flat STRING in
        Spark 4 (nested namespaces unsupported → StringType) — joining it
        with "." iterated its CHARACTERS ("db" → "d.b"), producing a bogus
        multi-level namespace whose %1F wire path then broke the SigV4
        signature (double-encoded). Normalize both possible shapes.
        """
        tables = []
        for ns_row in spark.sql(f"SHOW NAMESPACES IN {CATALOG}").collect():
            namespace = ns_row["namespace"]
            if not isinstance(namespace, str):
                namespace = ".".join(namespace)
            for t_row in spark.sql(f"SHOW TABLES IN {CATALOG}.{namespace}").collect():
                tables.append(f"{namespace}.{t_row['tableName']}")
        return tables


    def compact(spark, table, target_bytes):
        """Bin-pack small data files up to the target size.

        partial-progress commits every few file groups so a long compaction
        can be retried without redoing everything.
        """
        result = spark.sql(f"""
            CALL {CATALOG}.system.rewrite_data_files(
                table => '{table}',
                options => map(
                    'target-file-size-bytes', '{target_bytes}',
                    'partial-progress.enabled', 'true',
                    'partial-progress.max-commits', '5'
                )
            )""").first()
        print(f"    ↺ compact: {result.asDict()}")


    def rewrite_manifests(spark, table):
        """Consolidate small manifests so scan planning reads fewer files."""
        result = spark.sql(
            f"CALL {CATALOG}.system.rewrite_manifests(table => '{table}')"
        ).first()
        print(f"    ↺ manifests: {result.asDict()}")


    def expire_snapshots(spark, table, max_age_seconds, retain_last):
        """Drop snapshots older than the retention window.

        Expired snapshots are removed from metadata and the procedure
        deletes files no longer referenced by any retained snapshot.
        """
        cutoff = datetime.now(timezone.utc) - timedelta(seconds=max_age_seconds)
        result = spark.sql(f"""
            CALL {CATALOG}.system.expire_snapshots(
                table => '{table}',
                older_than => TIMESTAMP '{ts_literal(cutoff)}',
                retain_last => {int(retain_last)}
            )""").first()
        print(f"    ↺ expire: {result.asDict()}")


    def remove_orphan_files(spark, table, min_age_seconds):
        """Delete files in the table location that no snapshot references.

        The min-age grace window protects files from writes that are still
        in flight — never set it below the longest expected write.
        """
        cutoff = datetime.now(timezone.utc) - timedelta(seconds=min_age_seconds)
        result = spark.sql(f"""
            CALL {CATALOG}.system.remove_orphan_files(
                table => '{table}',
                older_than => TIMESTAMP '{ts_literal(cutoff)}'
            )""")
        orphans = result.collect()
        print(f"    ↺ orphans: {len(orphans)} file(s) removed")
        for row in orphans[:10]:
            print(f"      - {row['file_path']}")


    def main():
        required = [
            "RUSTFS_PROTOCOL",
            "RUSTFS_ENDPOINT_HOST",
            "RUSTFS_ENDPOINT_PORT",
            "RUSTFS_REGION",
            "RUSTFS_ACCESS_KEY",
            "RUSTFS_SECRET_KEY",
        ]
        missing = [name for name in required if not os.getenv(name)]
        if missing:
            fail("empty env vars", missing)

        protocol = os.getenv("RUSTFS_PROTOCOL")
        host = os.getenv("RUSTFS_ENDPOINT_HOST")
        port = os.getenv("RUSTFS_ENDPOINT_PORT")
        region = os.getenv("RUSTFS_REGION")
        rest_uri = f"{protocol}://{host}:{port}/iceberg"
        s3_endpoint = f"{protocol}://{host}:{port}"

        target_bytes = parse_bytes(os.getenv("MAINT_TARGET_FILE_SIZE"), 512 * 1024**2)
        max_age_seconds = parse_seconds(os.getenv("MAINT_SNAPSHOT_MAX_AGE"), 7 * 86400)
        retain_last = int(os.getenv("MAINT_RETAIN_LAST", "10"))
        orphan_min_age = parse_seconds(os.getenv("MAINT_ORPHAN_MIN_AGE"), 3 * 86400)

        spark = (
            SparkSession.builder.appName("iceberg-maintenance")
            .master(os.getenv("MAINT_SPARK_MASTER", "local[2]"))
            # CALL procedures + Iceberg SQL
            .config(
                "spark.sql.extensions",
                "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions",
            )
            # REST catalog over RustFS, SigV4-signed like the DuckDB ATTACH
            .config(f"spark.sql.catalog.{CATALOG}", "org.apache.iceberg.spark.SparkCatalog")
            .config(f"spark.sql.catalog.{CATALOG}.type", "rest")
            .config(f"spark.sql.catalog.{CATALOG}.uri", rest_uri)
            # warehouse is REQUIRED for the RustFS built-in table catalog:
            # its routes are S3Tables-shaped ({prefix}/{warehouse}/namespaces/...)
            # and the config response only returns the `prefix` override when
            # the client sends ?warehouse=... on GET /v1/config. Without it the
            # Java client uses unprefixed spec paths (/v1/namespaces) that
            # match no route and fail with 501 "A header you provided implies
            # functionality that is not implemented". Must match the
            # generator's warehouse (GENERATOR_CATALOG_WAREHOUSE or
            # CATALOG_NAME = 'datalake').
            .config(
                f"spark.sql.catalog.{CATALOG}.warehouse",
                os.getenv("MAINT_CATALOG_WAREHOUSE") or CATALOG,
            )
            .config(f"spark.sql.catalog.{CATALOG}.rest.sigv4-enabled", "true")
            .config(f"spark.sql.catalog.{CATALOG}.rest.signing-name", "s3")
            .config(f"spark.sql.catalog.{CATALOG}.rest.signing-region", region)
            # S3 FileIO pointed at RustFS (endpoint override, path-style)
            .config(
                f"spark.sql.catalog.{CATALOG}.io-impl",
                "org.apache.iceberg.aws.s3.S3FileIO",
            )
            .config(f"spark.sql.catalog.{CATALOG}.s3.endpoint", s3_endpoint)
            .config(f"spark.sql.catalog.{CATALOG}.s3.path-style-access", "true")
            .config(f"spark.sql.catalog.{CATALOG}.s3.region", region)
            .config(
                f"spark.sql.catalog.{CATALOG}.s3.access-key-id",
                os.getenv("RUSTFS_ACCESS_KEY"),
            )
            .config(
                f"spark.sql.catalog.{CATALOG}.s3.secret-access-key",
                os.getenv("RUSTFS_SECRET_KEY"),
            )
            # client.* feeds only the generic AWS SDK clients; the REST
            # catalog SigV4 signer (RESTSigV4AuthSession ->
            # AwsProperties.restCredentialsProvider) reads credentials from
            # the rest.access-key-id / rest.secret-access-key properties
            # specifically. Without rest.* the signer falls back to the AWS
            # SDK credential chain, finds nothing in-cluster, and every
            # catalog request dies with SdkClientException "Unable to load
            # credentials from any of the providers in the chain".
            .config(
                f"spark.sql.catalog.{CATALOG}.rest.access-key-id",
                os.getenv("RUSTFS_ACCESS_KEY"),
            )
            .config(
                f"spark.sql.catalog.{CATALOG}.rest.secret-access-key",
                os.getenv("RUSTFS_SECRET_KEY"),
            )
            # client.* kept as harmless fallbacks for other AWS clients.
            .config(
                f"spark.sql.catalog.{CATALOG}.client.access-key-id",
                os.getenv("RUSTFS_ACCESS_KEY"),
            )
            .config(
                f"spark.sql.catalog.{CATALOG}.client.secret-access-key",
                os.getenv("RUSTFS_SECRET_KEY"),
            )
            .config(f"spark.sql.catalog.{CATALOG}.client.region", region)
            .config("spark.sql.defaultCatalog", CATALOG)
            .getOrCreate()
        )

        # Diagnostics: show what catalog conf actually reached Spark so
        # credential/signing plumbing issues are visible in job logs.
        # spark.conf.getAll is a dict property in PySpark 4.x.
        for conf_key in sorted(dict(spark.conf.getAll)):
            if CATALOG in conf_key:
                conf_value = spark.conf.get(conf_key)
                if "access-key" in conf_key or "secret" in conf_key:
                    conf_value = f"<len {len(conf_value)}>"
                print(f"DEBUG spark conf {conf_key}={conf_value}")
        for env_key in ("RUSTFS_ACCESS_KEY", "RUSTFS_SECRET_KEY", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_REGION"):
            env_value = os.getenv(env_key)
            print(f"DEBUG env {env_key} len={len(env_value) if env_value else 0}")

        # Discovery failure must NOT become a bare crash: the pyspark
        # traceback is the only place that names the REST endpoint the
        # catalog client 501'd on (ResourcePaths / ErrorHandlers frames).
        try:
            tables = discover_tables(spark)
        except Exception:  # noqa: BLE001
            print("❌ maintenance: table discovery failed", file=sys.stderr)
            traceback.print_exc()
            spark.stop()
            sys.exit(2)
        print(f"▶ catalog={CATALOG} tables={len(tables)}")
        for table in tables:
            print(f"→ {table}")

        failures = []

        def run(step_name, step):
            try:
                step()
            except Exception as error:  # noqa: BLE001 — one bad table must not block the rest
                failures.append(f"{table}/{step_name}: {error}")
                print(f"    ✗ {step_name}: {error}", file=sys.stderr)
                traceback.print_exc()

        for table in tables:
            run("compact", lambda: compact(spark, table, target_bytes))
            run("manifests", lambda: rewrite_manifests(spark, table))
            run(
                "expire",
                lambda: expire_snapshots(spark, table, max_age_seconds, retain_last),
            )
            run(
                "orphans",
                lambda: remove_orphan_files(spark, table, orphan_min_age),
            )

        spark.stop()

        if failures:
            print(f"❌ maintenance: {len(failures)} step(s) failed:", file=sys.stderr)
            for failure in failures:
                print(f"   - {failure}", file=sys.stderr)
            sys.exit(1)
        print("✅ maintenance: all tables up to date")


    if __name__ == "__main__":
        main()

  #
  # Tunables — referenced by name from the CronJob's env. Human-friendly
  # units (512MB, 7d) are parsed by maintenance.py.
  #
  MAINT_TARGET_FILE_SIZE: "512MB"   # bin-pack data files up to this size
  MAINT_SNAPSHOT_MAX_AGE: "7d"      # expire snapshots older than this
  MAINT_RETAIN_LAST: "10"           # always keep at least N snapshots
  MAINT_ORPHAN_MIN_AGE: "72h"       # orphan grace window (files newer than
                                    # this are never deleted, even if unreferenced)
  #
  # Log4j2 override for the maintenance driver JVM (activated via
  # JAVA_TOOL_OPTIONS in the CronJob): keeps Spark's console appender and
  # INFO root level, adds DEBUG for the AWS SigV4 signer — it prints
  # "AWS4 Canonical Request: …" / string-to-sign for EVERY signed REST
  # call, which is how a SignatureDoesNotMatch between the Iceberg Java
  # client and RustFS gets localized (successful vs failing request,
  # byte for byte) — plus the Apache HttpClient 5 wire logger for the
  # actually-sent bytes.
  #
  log4j2-wire.properties: |
    status = error
    dest = out
    name = maintenance-wire

    appender.console.type = Console
    appender.console.name = console
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
    appender.console.filter.threshold.type = ThresholdFilter
    appender.console.filter.threshold.level = debug

    rootLogger.level = info
    rootLogger.appenderRef.stdout.ref = console

    logger.signer.name = software.amazon.awssdk
    logger.signer.level = debug
    logger.wire.name = org.apache.hc.client5.wire
    logger.wire.level = debug
